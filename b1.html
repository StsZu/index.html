<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Polski B1 · Gramatyka — тренажер</title>
<style>
:root{
  --bg:#f5f6f8;--card:#ffffff;--ink:#17212b;--mut:#5a6775;--line:#d8dde4;
  --acc:#b3142c;--acc-ink:#ffffff;--acc-soft:#fdeaee;
  --ok:#12733b;--ok-bg:#e2f5e9;--near:#8a5a00;--near-bg:#fff1cc;--bad:#b3261e;--bad-bg:#fde7e5;
  --focus:#1d5fd1;--chip:#edf0f4;--shadow:0 1px 2px rgba(16,24,40,.08);
  --fs:1;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10151b;--card:#1a212a;--ink:#e8edf2;--mut:#9ba8b5;--line:#303b47;
    --acc:#ff7085;--acc-ink:#22080d;--acc-soft:#3a1b23;
    --ok:#74d99e;--ok-bg:#14331f;--near:#f3c765;--near-bg:#3a2e10;--bad:#ff8f86;--bad-bg:#3e1a18;
    --focus:#8ab4ff;--chip:#252e39;--shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;overflow-wrap:anywhere}
a{color:var(--acc)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:1.4rem;line-height:1.25;margin:0 0 .25rem}
h2{font-size:1.1rem;margin:1.5rem 0 .5rem}
h3{font-size:1rem;margin:0}
h4{font-size:1rem;margin:1rem 0 .25rem}
p{margin:.5rem 0}
.mut{color:var(--mut)}
.small{font-size:.875rem}

.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 max(8px,env(safe-area-inset-left));min-height:48px;font-size:16px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);padding:8px 4px;margin-right:auto;white-space:nowrap}
.brand b{color:var(--acc)}
.top nav{display:flex;gap:2px}
.top nav a{display:inline-flex;align-items:center;gap:.25rem;min-height:40px;min-width:40px;justify-content:center;padding:0 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:15px}
.top nav a[aria-current="page"]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 5px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;text-align:center;line-height:20px}
.top nav a{white-space:nowrap}
@media (max-width:430px){.brand .long{display:none}.top nav a{padding:0 6px;font-size:14px}}

main{max-width:820px;margin:0 auto;padding:1rem max(.75rem,env(safe-area-inset-left)) 2rem;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;box-shadow:var(--shadow)}
.card + .card{margin-top:.75rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.grow{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;min-height:44px;padding:0 1rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:0 .75rem;font-size:.9375rem}
.btn[disabled]{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}

.bar{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:999px}
.grp{font-size:.8125rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:1.5rem 0 .5rem}
.tlist{display:grid;gap:.5rem}
@media (min-width:640px){.tlist{grid-template-columns:1fr 1fr}}
.tcard{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--acc)}
.tcard .pl{font-weight:700}
.tcard .ua{color:var(--mut);font-size:.875rem;margin-bottom:.5rem}
.tcard .st{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--mut);margin-top:.25rem}
.hero{display:grid;gap:.75rem}
@media (min-width:640px){.hero{grid-template-columns:1.4fr 1fr}}
.big{font-size:2rem;font-weight:800;line-height:1.1}
.tip{border-left:4px solid var(--acc);padding:.5rem .75rem;background:var(--acc-soft);border-radius:0 8px 8px 0}

.elist{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.elist a{display:flex;align-items:center;gap:.75rem;min-height:56px;padding:.5rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--ink)}
.elist a:hover{border-color:var(--acc)}
.elist .rn{font-weight:800;min-width:3.25rem;color:var(--acc)}
.elist .inf{flex:1 1 auto;min-width:0}
.elist .res{font-weight:700;white-space:nowrap}
.res.done{color:var(--ok)}

.crumb{display:inline-flex;align-items:center;min-height:40px;text-decoration:none;font-size:.9375rem}
.meta{color:var(--mut);font-size:.875rem}
.ins{margin:.75rem 0 .25rem;font-weight:600}
.ins-ua{color:var(--mut);font-size:.9375rem;margin:0 0 .75rem}
.box{border:1px solid var(--line);border-radius:10px;padding:.5rem .75rem;margin:.75rem 0;background:var(--card)}
.box > .lbl{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.box.hint{border-color:var(--near);background:var(--near-bg)}
.box.info{border-style:dashed}
.bank{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.375rem}
.bank .w{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:44px;padding:0 .75rem;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-weight:600}
.bank button.w{cursor:pointer}
.bank button.w:hover{border-color:var(--acc)}
.bankbar{position:sticky;top:48px;z-index:10;background:var(--bg);padding:.25rem 0;margin:0 0 .25rem}
.bankbar .box{margin:0;padding:.375rem}
.bankbar .lbl{display:none}
.bankbar .bank{gap:.25rem;margin-top:0}
.bankbar .w{padding:0 .5rem}
.xbar ~ .bankbar{top:106px}

.body{font-size:1.0625rem;line-height:2.5}
.body p{margin:0}
.body p + p{margin-top:.25rem}
.body ol,.body ul{margin:.25rem 0;padding-left:1.75rem}
.body li{padding-left:.125rem}
.body.olnum sup.n{display:none}
.body.static{line-height:1.7}
.body.static p + p{margin-top:.375rem}
u.ul{text-decoration-thickness:2px;text-underline-offset:3px}
sup.n{font-size:.6875rem;color:var(--mut);font-weight:700;margin:0 1px 0 2px;vertical-align:super;line-height:0}
.g{white-space:nowrap}
input.gap{height:40px;max-width:100%;padding:0 .375rem;border:0;border-bottom:2px solid var(--mut);border-radius:6px 6px 0 0;background:var(--chip);text-align:center;font-weight:600;vertical-align:baseline}
input.gap:focus{outline:none;border-bottom-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
.mk{display:inline-block;font-weight:800;margin-left:2px;min-width:0}
.ok input.gap,.ok textarea.sent{border-color:var(--ok);background:var(--ok-bg)}
.near input.gap,.near textarea.sent{border-color:var(--near);background:var(--near-bg)}
.bad input.gap,.bad textarea.sent{border-color:var(--bad);background:var(--bad-bg)}
.ok > .mk{color:var(--ok)} .near > .mk{color:var(--near)} .bad > .mk{color:var(--bad)}
.xmp{font-weight:700;border-bottom:2px solid var(--ink);padding:0 .25rem}
.fill{font-weight:600;border-bottom:1px dashed var(--mut);padding:0 .125rem}
.ch{display:inline-flex;flex-wrap:wrap;align-items:center;max-width:100%;white-space:normal;vertical-align:middle;padding:1px 2px;margin:2px 1px;border-radius:14px;background:var(--chip);line-height:1.2}
.ch > sup.n{margin:0 3px 0 6px;vertical-align:baseline;line-height:1}
.opt{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:44px;margin:2px;padding:0 .625rem;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-weight:500;line-height:1.2;vertical-align:middle;text-align:left}
.opt:hover{border-color:var(--mut)}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}
.opt.st{cursor:default;min-height:32px}
.opt.st.cor{border-color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.ch.ok .opt[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--card)}
.ch.bad .opt[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--card)}
.ch.bad.none .opt{border-color:var(--bad)}
.g.rv{white-space:normal}
.rv .ua{font-weight:700;padding:0 .25rem;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rv.ok .ua{background:var(--ok-bg);color:var(--ok)}
.rv.near .ua{background:var(--near-bg);color:var(--near)}
.rv.bad .ua{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.rv.bad .ua.empty{text-decoration:none}
.rv .ca{font-weight:700;color:var(--ok);margin-left:.25rem;white-space:normal}
.rv .ca::before{content:"→ ";font-weight:400;color:var(--mut)}

.sitems{list-style:none;margin:0;padding:0;display:grid;gap:.75rem;line-height:1.5}
.si{border:1px solid var(--line);border-radius:10px;padding:.625rem .75rem;background:var(--card)}
.si .q{font-weight:500}
.si .q .n{font-weight:800;color:var(--acc);margin-right:.375rem}
.si .cue{display:inline-block;margin:.25rem 0;padding:0 .5rem;border-radius:6px;background:var(--chip);font-weight:700}
.si .aw{display:flex;align-items:flex-start;gap:.25rem;margin-top:.25rem}
textarea.sent{flex:1 1 auto;min-height:44px;width:100%;resize:none;overflow:hidden;padding:.5rem .625rem;border:1px solid var(--mut);border-radius:8px;background:var(--chip);line-height:1.4;font-weight:600}
textarea.sent:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
.si .mk{line-height:44px;min-width:1.25rem}
.si .ans{margin-top:.25rem;font-weight:700}
.si.x{border-style:dashed}

.result{margin-top:1rem}
.result .sc{font-size:1.25rem;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:.25rem 1rem;font-size:.875rem;color:var(--mut);margin-top:.25rem}
.legend b.ok{color:var(--ok)} .legend b.near{color:var(--near)} .legend b.bad{color:var(--bad)}
.key ol{columns:2;column-gap:1.5rem;margin:.25rem 0;padding-left:1.75rem}
.key.wide ol{columns:1}
.key li{break-inside:avoid;margin-bottom:.125rem}
.key .alt{color:var(--mut);font-weight:400}
@media (max-width:480px){.key ol{columns:1}}
.pn{display:flex;gap:.5rem;margin-top:1.25rem}
.pn .btn{flex:1 1 0;min-width:0}

table.t{width:100%;border-collapse:collapse;font-size:.9375rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.375rem .5rem;text-align:left;vertical-align:top}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
.pass{color:var(--ok)} .fail{color:var(--bad)}

.xbar{position:sticky;top:48px;z-index:15;display:flex;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.375rem .5rem;margin-bottom:.75rem;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.125rem;min-width:4.25rem;text-align:center}
.timer.low{color:var(--bad)}
.ovw{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.ovw .btn{flex-direction:column;padding:.25rem;min-height:56px}
.ovw .btn small{font-weight:400;color:var(--mut)}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:.375rem max(.5rem,env(safe-area-inset-left)) calc(.375rem + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(16,24,40,.08)}
#dock[hidden]{display:none}
#dock .in{max-width:820px;margin:0 auto;display:grid;gap:.375rem}
.letters{display:grid;grid-template-columns:repeat(10,1fr);gap:.25rem}
.letters button{min-height:40px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--chip);font-size:1.125rem;font-weight:700;cursor:pointer;padding:0;touch-action:manipulation}
.letters button:active{background:var(--acc-soft)}
.letters button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
@media (max-width:460px){.letters{grid-template-columns:repeat(5,1fr)}}
.acts{display:flex;gap:.375rem}
.acts .btn{flex:1 1 0;min-width:0;padding:0 .375rem;font-size:.9375rem;line-height:1.15}
.acts .btn.pri{flex:1.6 1 0}
body.kb .acts{display:none}
@media (pointer:coarse){body:not(.typing) .letters{display:none}}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
@media (min-width:640px){.modal{align-items:center}}
.dlg{background:var(--card);color:var(--ink);width:100%;max-width:760px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;border:1px solid var(--line)}
@media (min-width:640px){.dlg{border-radius:16px}}
.dlg > header{display:flex;align-items:center;gap:.5rem;padding:.5rem .5rem .5rem 1rem;border-bottom:1px solid var(--line)}
.dlg > header h2{margin:0;flex:1 1 auto;font-size:1.0625rem}
.dlg > .cnt{padding:.75rem 1rem 1rem;overflow:auto;-webkit-overflow-scrolling:touch}
.dlg > footer{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;padding:.75rem 1rem;border-top:1px solid var(--line)}
.sheet table{width:100%;border-collapse:collapse;font-size:.9375rem;margin:.5rem 0}
.sheet th,.sheet td{border:1px solid var(--line);padding:.3rem .45rem;text-align:left;vertical-align:top}
.sheet th{background:var(--chip);font-size:.8125rem}
.sheet i{font-style:normal;font-weight:600;color:var(--acc)}
.sheet ul{padding-left:1.25rem;margin:.375rem 0}
.sheet .tw{overflow-x:auto}

#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:60;max-width:min(92vw,520px);background:var(--ink);color:var(--card);padding:.625rem .875rem;border-radius:10px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;min-width:56px;border:0;border-right:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><b>Polski B1</b><span class="long"> · Gramatyka</span></a>
  <nav aria-label="Головне меню">
    <a href="#/" data-nav="home">Теми</a>
    <a href="#/errors" data-nav="errors">Помилки <span class="badge" id="errBadge" hidden></span></a>
    <a href="#/exam" data-nav="exam">Іспит</a>
    <a href="#/settings" data-nav="settings" aria-label="Налаштування" title="Налаштування">⚙</a>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
<div id="dock" hidden><div class="in">
  <div class="letters" id="letters" role="group" aria-label="Польські літери" hidden></div>
  <div class="acts" id="acts"></div>
</div></div>
<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <header><h2 id="dlgTitle"></h2><button class="btn sm ghost" id="dlgClose" type="button" aria-label="Закрити">✕</button></header>
  <div class="cnt" id="dlgBody"></div>
  <footer id="dlgFoot"></footer>
</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script id="b1-data">
/* ===== ДАНІ: тексти вправ і ключ зі збірника «Poprawność gramatyczna B1» (6_B1_PG.pdf) =====
   Розмітка тексту:
   {{відповідь|варіант}}  пропуск для вписування (усі варіанти з ключа)
   {=зразок}              заповнений приклад (пункт 0)
   [[a|*b|c]]             вибір форми, * — правильна; [[=a|*b|c]] — приклад
   __слово__              підкреслення, ^1^ — номер над словом
   рядок «# …»            пункт нумерованого списку, «- …» — пункт списку
*/
const U = {
  pod: 'Оберіть правильну форму слова (у збірнику — «підкресліть») за зразком.',
  naw: 'Доповніть текст правильною формою слів у дужках за зразком.',
  zai: 'Доповніть текст правильною формою потрібного займенника за зразком.',
  prz: 'Перетворіть речення за зразком.'
};

const T_IM = [
{id:'rz', g:0, pl:'Odmiana rzeczownika i przymiotnika', ua:'Відмінювання іменників і прикметників', ex:[
 {n:'I', p:4, t:'c', pts:0.25,
  ins:'Proszę podkreślić poprawną formę wyrazów zgodnie z podanym przykładem (odmiana rzeczowników).', ua:U.pod,
  hint:'Дивіться на прийменник і питання: «куди?» (na, nad, w, za + знахідний) чи «де?» (nad + орудний, w/na/o/po + місцевий). Після «nie ma», «nie lubimy», «dużo» — родовий; після «dzięki» — давальний.',
  text:`Od lat z [[=męża|mężowi|*mężem]] podróżujemy po [[Europa|Europę|*Europie]]. Cały rok z niecierpliwością czekamy na [[wakacjach|*wakacje|wakacji]], bo tylko wtedy możemy wyjechać za [[*granicę|granicą|granicy]]. Co dwa lata jeździmy nad [[morzem|*morze|morzu]], gdzie możemy uprawiać [[sportów wodnych|*sporty wodne|sportach wodnych]]. Kiedy jesteśmy nad [[morze|morzu|*morzem]], odpoczywamy i jednocześnie trenujemy. Często wybieramy się też w [[*góry|górę|górach]], ponieważ uwielbiamy [[*widoki|widoków|widoku]], które można podziwiać ze [[*szczytów|szczyty|szczytami]]. Ponadto chętnie zwiedzamy [[zabytków|zabytku|*zabytki]] w europejskich stolicach, chociaż nie lubimy [[ruch|*ruchu|ruchy]] na ulicach miast. W czasie wypraw robimy bardzo dużo [[zdjęcia|zdjęcie|*zdjęć]]. Po powrocie pokazujemy je [[znajomych|*znajomym|znajomi]] i opowiadamy im o [[*naszych przygodach|nasze przygody]]. Dzięki [[*wspomnieniom|wspomnienia|wspomnieniami]] jesteśmy pogodni nawet wtedy, kiedy za oknem nie ma [[słońcu|*słońca|słońce]].`},
 {n:'II', p:4, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem (odmiana rzeczowników i przymiotników).', ua:U.naw,
  hint:'Прикметник узгоджується з іменником у роді, числі й відмінку. «na» / «w» (де?) + місцевий множини: -ach і -ych/-ich; «wytwarza» (що?) + знахідний; після іменника («walory…», «postać…») — родовий.',
  text:`Gdy trzy lata temu piękna Polka wychodziła za mąż podpisała {=intercyzę} {=małżeńską} (intercyza małżeńska). Zdjęcia aktorki można znaleźć na wielu {{stronach}} {{internetowych}} (strona internetowa) i w znanych {{czasopismach}} {{filmowych}} (czasopismo filmowe). Ona jednak uważa, że prawdziwe piękno nosimy w sobie. To ono wytwarza {{naszą}} {{aurę}} (nasza aura). Walory {{niepowtarzalnej}} {{urody}} (niepowtarzalna uroda) gwiazdy docenili producenci. W kolejnym filmie Grażyna Szapołowska wcieli się w postać {{najsłynniejszej}} {{trucicielki}} (najsłynniejsza trucicielka).`},
 {n:'III', p:5, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem (odmiana rzeczowników).', ua:U.naw,
  hint:'«na», «w», «po», «o» (де? про що?) + місцевий: -e з чергуванням (piętro → piętrze, sen → śnie), множина -ach. «z», «do» + родовий. «cieszyć się» + орудний. Підмет чоловічо-особовий у множині: -y/-i з чергуванням.',
  text:`Nasze małe mieszkanko znajdowało się w centrum {=Warszawy} (Warszawa) na dziesiątym {{piętrze}} (piętro). Z jego {{okna|okien}} (okno) roztaczał się widok na Pałac Kultury, centrum i tory kolejowe. Rano wybiegaliśmy z niego każdy do swoich {{zajęć}} (zajęcie). Wieczorem po {{pracy}} (praca) wracaliśmy zmęczeni, żeby odpocząć we własnych czterech {{ścianach}} (ściana) i cieszyć się {{widokiem}} (widok) stolicy. Ale piękny widok nie mógł zrekompensować {{hałasu}} (hałas) przejeżdżających dołem {{pociągów}} (pociąg). Ich intensywne życie zaczynało się właśnie wtedy, kiedy wszyscy {{mieszkańcy}} (mieszkaniec) naszego bloku marzyli o {{śnie}} (sen).`},
 {n:'IV', p:5, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem (odmiana rzeczowników).', ua:U.naw,
  hint:'«do», «od», «nie ma», «wiele», «wystarczy», прикметник у родовому множини + іменник — родовий множини (часто нульове закінчення: kasa → kas). «dzięki» + давальний (-owi). «mieć» + знахідний (ж. р. -ę). «w ostatnim…» — місцевий.',
  text:`Piotr i Małgorzata wybrali się do {=kina} (kino). Kolejki do {{kas}} (kasa) były tak długie, że bali się, czy wystarczy {{biletów}} (bilet). Na szczęście nie zabrakło, ale niestety okazało się, że nie ma już wolnych {{miejsc}} (miejsce) obok siebie. Musieli więc usiąść osobno w ostatnim {{rzędzie}} (rząd). Oboje mieli jednak {{nadzieję}} (nadzieja), że może dzięki {{filmowi}} (film) odpoczną od codziennych {{zajęć}} (zajęcie). Zresztą wszyscy {{widzowie}} (widz) spodziewali się niezwykłych {{wrażeń}} (wrażenie), gdyż film zdobył wiele {{nagród}} (nagroda).`},
 {n:'V', p:6, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem (odmiana rzeczowników).', ua:U.naw,
  ex:`Byłem w {=domu} (dom) już o 15.00.`,
  hint:'Місяці: «w» + місцевий (-u). «z okazji», «wiele», «od… do…» + родовий. «cieszyć się» + орудний. «o» (про що?) і «po» (де?) + місцевий. «z» (з ким?) + орудний множини -ami. «dzięki» + давальний.',
  text:`W {{czerwcu}} (czerwiec) Piotrek dostał z okazji {{urodzin}} (urodziny) wiele {{prezentów}} (prezent), ale najbardziej cieszył się {{rowerem|z roweru}} (rower). O {{rowerze}} (rower) marzył już dawno. Teraz od {{rana}} (rano) do {{nocy}} (noc) jeździ z {{kolegami}} (koledzy) po {{mieście}} (miasto). Dzięki {{sportowi}} (sport) stał się zdecydowanie zdrowszy.`},
 {n:'VI', p:6, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem (odmiana rzeczowników).', ua:U.naw,
  hint:'«szukać», «brak», «do» + родовий. «w» (де? коли?) + місцевий. «jeździć» (чим?) + орудний. «pomagać» (кому?) + давальний. «dwaj…» — називний чоловічо-особовий множини (-owie). Слова на -um в однині не відмінюються.',
  text:`Ostatnio dużo zmienia się w naszym {=życiu} (życie). Mój mąż długo szukał {{pracy}} (praca) i w końcu ją znalazł. Teraz będzie pracował w {{fabryce}} (fabryka) porcelany. Codziennie będzie tam jeździł {{rowerem}} (rower). Mam nadzieję, że w końcu przestaniemy narzekać na brak {{pieniędzy}} (pieniądze). Nasi dwaj {{synowie}} (syn) ożenili się i wyprowadzają się do własnych {{mieszkań}} (mieszkanie). Nasza córka w przyszłym {{tygodniu}} (tydzień) po raz pierwszy pójdzie do {{gimnazjum}} (gimnazjum). Niedawno zmarła moja bratowa, dlatego teraz muszę trochę więcej pomagać {{bratu}} (brat). Myślimy nawet o tym, żeby zamieszkać w jego dużym {{domu}} (dom).`},
 {n:'VII', p:6, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem (odmiana rzeczowników).', ua:U.naw,
  ex:`On nie ma {=psa} (pies).`,
  hint:'«życzyć» — кому? (давальний: -owi, ж. р. -e/-i) + чого? (родовий). Після «dużo» і «miłych» — теж родовий.',
  text:`Uwielbiam składać życzenia. W tym miesiącu będą urodziny Marka, mojej siostry, babci i mamy. Chcę życzyć {{Markowi}} (Marek) {{sukcesów}} (sukcesy) w szkole i dużo {{radości}} (radość). Mojej {{siostrze}} (siostra) będę życzył {{powodzenia}} (powodzenie) na egzaminach i dużo {{miłości}} (miłość), a babci {{zdrowia}} (zdrowie) i {{szczęścia}} (szczęście). Dla mamy mam specjalne życzenia. Chcę jej życzyć miłych {{wakacji}} (wakacje).`},
 {n:'VIII', p:7, t:'f', pts:0.5, kg:2,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem (odmiana rzeczowników).', ua:'Доповніть текст правильною формою слів у дужках за зразком. Кожне слово — окремий пропуск (20 × 0,5 б.).',
  ex:`Maria i Antoni są bardzo {=towarzyskimi} {=ludźmi} (towarzyski człowiek).`,
  hint:'Відмінюйте обидва слова разом. «wielu» + родовий (про людей) або давальний («wielu… podobają się» — кому?). «do» + родовий; «nad», «jest» (чим?) + орудний; «odwiedzać», «przez» + знахідний; «przy» + місцевий; «opowieści» (чиї?) + родовий.',
  text:`Państwo Antoni i Maria Kowalscy mają wielu {{dobrych}} {{przyjaciół}} (dobry przyjaciel) i często zapraszają ich do {{swojego}} {{domu}} (swój dom), który stoi w lesie nad {{jeziorem}} {{mazurskim}} (jezioro mazurskie). Nic dziwnego, że goście lubią odwiedzać {{państwa}} {{Kowalskich}} (państwo Kowalscy) w tej pięknej i spokojnej okolicy. Wielu {{starym}} {{znajomym}} (stary znajomy) bardzo podobają się nie tylko mazurskie krajobrazy, ale także opowieści {{pana}} {{Antoniego}} (pan Antoni), którym przysłuchują się przy {{pysznej}} {{szarlotce}} (pyszna szarlotka) zrobionej przez {{panią}} {{Marię}} (pani Maria). Antoni i Maria są malarzami, dlatego {{najważniejszą}} {{atrakcją}} (najważniejsza atrakcja) każdego ze spotkań towarzyskich jest pokaz kilku {{ostatnich}} {{prac}} (ostatnia praca) gospodarzy.`},
 {n:'IX', p:7, t:'b', pts:0.5, ins1:1,
  ins:'Proszę uzupełnić tekst właściwą formą wyrazów z ramki zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою слів із рамки за зразком. Дотик по слову вставляє його в активний пропуск — далі змініть закінчення.',
  bank:['monopolowy','apteka','delikatesy','księgarnia','obuwniczy','cukiernia','warsztat','jubilerski','kwiaciarnia','postój','przystanek'],
  hint:'Спершу виберіть слово за змістом, потім поставте у відмінок: «na» (куди?) + знахідний; «obok», «do» + родовий; «w», «przy» + місцевий; «mam» (що?) + знахідний. «monopolowy», «obuwniczy» відмінюються як прикметники.',
  text:`Moja żona ma jutro urodziny, mam więc do załatwienia parę spraw na mieście, a tu jak na złość musiałem oddać samochód do {=warsztatu} i naprawa potrwa kilka dni. Nie wiem teraz czy pójść na {{przystanek}} tramwajowy, czy lepiej od razu na {{postój}} taksówek. Muszę załatwić tyle spraw! Obok {{księgarni}}, do której zaglądam regularnie po nowe książki, jest sklep {{jubilerski}}, gdzie widziałem niedużą złotą broszkę. Bez samochodu będę tam jechał godzinę! Chyba jednak pojadę taksówką. Po drodze mam {{kwiaciarnię}}, więc zamówię na jutro kwiaty, w {{cukierni}} zamówię tort. Żona przygotowuje przyjęcie i pewnie jak zwykle będzie za dużo jedzenia, więc może poproszę taksówkarza, żeby zatrzymał na chwilę przy {{aptece}} i wezmę jakieś krople na żołądek – tak na wszelki wypadek. W {{delikatesach}} kupię dobrą kawę i jakiś koniak..., chociaż może lepiej po alkohole wybrać się do {{monopolowego}}. Odkąd samochód jest w naprawie, zauważyłem, że mam niezbyt wygodne buty, ale nie wiem, czy znajdę czas, żeby wejść do {{obuwniczego}} i kupić sobie jakieś wygodniejsze.`}
]},

{id:'zo', g:0, pl:'Zaimki osobowe', ua:'Особові займенники', ex:[
 {n:'I', p:8, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:U.naw,
  ex:`Czekam na {=ciebie} (ty).`,
  hint:'Після прийменника займенник 3-ї особи починається на n-. Перевірте відмінок: «o» + місцевий, «na» + знахідний, «z» + орудний; «przynosi» — кому? (давальний); «odprowadza» — кого? (знахідний).',
  text:`Piotr zakochał się w Agnieszce. Myśli o {{niej}} (ona) cały czas. Codziennie czeka na {{nią}} (ona) przed uniwersytetem, przynosi {{jej}} (ona) róże, odprowadza {{ją}} (ona) do domu. Rozmawia z {{nią}} (ona) o wszystkim.`},
 {n:'II', p:8, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą właściwego zaimka zgodnie z podanym przykładem.', ua:U.zai,
  ex:`Wczoraj odwiedziłam moich rodziców. Często odwiedzam {=ich} w niedzielę.`,
  hint:'Спершу визначте, про кого мова (я, вони, вона, він), потім відмінок: «z» + орудний, «za» (przepadać za) + орудний, «bez», «do» + родовий, «pomagać», «opowiadać», «być wdzięcznym» — кому? (давальний), «pytać», «kochać» — кого?',
  text:`Rozmawiam z {{nimi}} o ich zdrowiu, a oni pytają {{mnie}} o moją pracę i rodzinę. Opowiadam {{im}} o mojej córce – ich wnuczce – Oli. Ola czasem przyjeżdża ze {{mną}} do dziadków, którzy po prostu za {{nią}} przepadają. Nic dziwnego, jest przecież ich jedyną wnuczką! Ona też bardzo {{ich}} kocha i uwielbia pomagać {{im}} w ogrodzie. Mój mąż pracuje za granicą, więc zwykle jeżdżę bez {{niego}}. On też lubi moich rodziców, więc telefonuje do {{nich}} regularnie i opowiada o tym, co się dzieje na świecie. Moi rodzice są {{mu}} za to bardzo wdzięczni.`},
 {n:'III', p:9, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą właściwego zaimka zgodnie z podanym przykładem.', ua:U.zai,
  hint:'Займенник заміняє іменник із попереднього речення: рід і число беріть від нього (życie — ono, warszawiacy — oni, dziewczyny — one). «o» + місцевий, «z» + орудний, «wśród», «według» + родовий; «miło jest», «podobają się», «wydają się», «smakują» — кому? (давальний).',
  text:`Warszawa, 20 lipca 2006 r.
Drogi Thomasie!
Bardzo dziękuję za Twój długi i ciekawy list. Zadajesz tyle pytań! Nie mam dzisiaj zbyt dużo czasu, spróbuję jednak na niektóre z {=nich} odpowiedzieć.
Chcesz wiedzieć, jak wygląda moje życie w Polsce. Dobrze, zaraz o {{nim}} opowiem, choć trudno {{je}} opisać w paru słowach. Po pierwsze: zaprzyjaźniłem się z wieloma warszawiakami najczęściej spędzam czas po pracy właśnie z {{nimi}}, najczęściej z dziewczynami, czuję się wśród {{nich}} zdecydowanie bardziej swojsko niż z mężczyznami. A szczególnie miło jest {{mi}} w towarzystwie pewnej Agnieszki. Zresztą, nie tylko {{mnie|mi}} podobają się polskie dziewczyny. Gdy zapytasz innych cudzoziemców, którzy mieszkają w Polsce, co o {{nich}} sądzą, usłyszysz, że Polki wydają {{im}} się ciepłe, otwarte i bardziej tolerancyjne od mężczyzn.
Thomasie, liczę na rewanż, to znaczy na ciekawe opowieści o Twoim stażu w Hiszpanii. Przede wszystkim napisz, jak smakują {{Ci}} potrawy hiszpańskie. Są chyba w Twoim guście, uwielbiasz przecież pomidory!!! Według {{mnie}} najlepszymi polskimi potrawami są zupy. Najsmaczniejsza, którą jadłem, to „zupa babuni”, czyli niedzielny rosół przygotowany przez babcię Agnieszki. Mniam, mniam!
Czekam na Twój kolejny list.
Mike, po polsku Michał
PS. Mniam, mniam znaczy, że coś było wyjątkowo smaczne i że chciałbyś jeszcze jedną porcję tego samego!!!`}
]},

{id:'zr', g:0, pl:'Zaimki – różne', ua:'Займенники: присвійні, вказівні, відносні, заперечні', ex:[
 {n:'I', p:10, t:'c', pts:0.25,
  ins:'Proszę podkreślić poprawną formę wyrazu zgodnie z podanym przykładem.', ua:U.pod,
  hint:'«jego», «jej», «ich» як присвійні (чий?) не змінюються і не мають n-. Форми на n- (niego, niej, nim) — лише після прийменника. Короткі форми (go, mu) — після дієслова без наголосу. «twój», «wasz» відмінюються як прикметники.',
  text:`Mężczyznę, którego wybrałaś na męża, cenisz za [[=*jego|niego|go]] urok, inteligencję, czułość. Prawdopodobnie, to właśnie jego matka nauczyła [[jego|*go|nim]] tego wszystkiego, co najbardziej cię w [[*nim|niego|niemu]] zachwyca. Postaraj się być [[*jej|niej|ją]] za to wdzięczna. Powinnaś poznać i szanować zasady panujące w [[ją|niej|*jej]] domu. Może niektóre warto przenieść do [[wasza|*waszej|waszą]] rodziny. Kochaj [[ją|niej|*jej]] syna i okazuj to - każda matka będzie ci wdzięczna za troskę o [[*jej|nią|ją]] nawet całkiem dorosłe dziecko. Zawsze pamiętaj, że matka [[twój|twoim|*twojego]] męża była przez kilkanaście lat najważniejszą kobietą [[niego|jemu|*jego]] życia i staraj się tego nie niszczyć. Pamiętaj, żebyście mieli dla [[*niej|nią|jej]] czas - tęskni za synem tak jak [[twoją|twojej|*twoja]] mama za [[*tobą|tobie|ciebie]].`},
 {n:'II', p:10, t:'c', pts:0.25,
  ins:'Proszę podkreślić poprawną formę wyrazu zgodnie z podanym przykładem.', ua:U.pod,
  ex:`Czy powinien zbadać [[=*go|jego|niego]] lekarz?`,
  hint:'На початку речення — повна форма (Jego, не Go). «niepokoi» — кого? (знахідний), «należy zrobić», «jest wygodnie» — кому? (давальний). Присвійні «mój», «nasz» узгоджуються з іменником («wnuka» — родовий).',
  text:`Mój wnuczek jest bardzo żywym chłopcem, świetnie się rozwija, bo w wieku siedmiu lat ma 152 cm wzrostu i waży 38 kg. [[Im|*Jego|Niego]] rodzice także są wysocy. Trochę [[mną|mi|*mnie]] to niepokoi, że przy każdym większym wysiłku chłopiec strasznie się poci. Martwię się o stan zdrowia [[*mojego|moim|mojemu]] wnuka, dlatego chciałabym wiedzieć, czy należy [[jemu|*mu|niemu]] zrobić jakieś badania. Czy organizm [[naszemu|naszym|*naszego]] wnuka dojrzewa zbyt szybko? Najgorsze, że rodzice chłopca nie widzą w tym nic złego. Prawdopodobnie jest [[ich|*im|nich]] tak wygodnie. Liczą na to, że kiedy chłopiec podrośnie, [[*ich|im|nich]] problemy nagle się skończą. Proszę więc uprzejmie o fachową poradę, co mam robić w tej sytuacji, czy słuchać [[ich|moje|*moich]] dzieci, czy leczyć wnuka...`},
 {n:'III', p:11, t:'c', pts:0.25,
  ins:'Proszę podkreślić poprawną formę wyrazu zgodnie z podanym przykładem.', ua:U.pod,
  hint:'«delfiny», «zwierzęta», «zajęcia» — не чоловічо-особові: te, one, same; знахідний — je. «uczyć» — кого? (je), «podawać» — кому? (im), «z» + орудний, «od» + родовий. «chcieć» — чого? Власник = підмет → swój.',
  text:`Na świecie jest dużo delfinariów, czyli basenów, w których można oglądać delfiny. [[=*Te|Tych|Ci]] zwierzęta morskie interesują człowieka od bardzo dawna. Po umieszczeniu delfinów w basenie zaczyna się [[ich|*je|one]] uczyć. Początkowo opiekun, siedząc w łódce, podaje [[ich|nim|*im]] ryby z ręki, ale już po paru dniach pływa wraz z [[*nimi|nich|nie]], częstuje rybami, gładzi delikatnie [[nim|nich|*ich]] ciepłą skórę. Delfiny bardzo lubią [[ci|*te|tych]] zajęcia i wkrótce [[sami|*same|samych]] poszukują towarzystwa [[*swojego|twojego|jego]] opiekuna. Dopiero [[*taka|taki|takie]] bliska znajomość pozwala na rozpoczęcie właściwego treningu. Delfiny niezwykle szybko rozumieją, [[co|czemu|*czego]] chce od [[nim|*nich|nimi]] trener i nieraz po jednej lekcji potrafią powtórzyć całe zadanie.`},
 {n:'IV', p:11, t:'f', pts:0.5,
  ins:'Proszę uzupełnić zdania poprawną formą właściwych zaimków zgodnie z podanym przykładem.', ua:'Доповніть речення правильною формою потрібних займенників за зразком.',
  ex:`Jan jest wspaniałym ojcem. Bardzo troszczy się o {=swoje} dzieci. Kiedy patrzę na {=jego} dzieci wierzę, że mężczyzna jest w stanie wychowywać je bez kobiety.`,
  hint:'Якщо власник — підмет цього ж речення, вживайте «swój» (у потрібному відмінку). Якщо власник інший — nasz, wasz, twój, mój. Форму підкаже іменник після пропуску.',
  note:'П. 5: ключ допускає також «z twoimi / z twymi» (тоді перед займенником «z», а не «ze»).',
  text:`# Wpłaciliśmy wszystkie pieniądze na konto, gdyż mamy zaufanie do {{naszego|swojego|swego}} banku.
# Zofia spędza każdą wolną chwilę w ogrodzie. Nie zaniedbuje {{swoich|swych}} roślin.
# Jesteśmy dobrymi sąsiadami. Możecie iść dzisiaj do kina, zaopiekujemy się {{waszymi}} dziećmi.
# Barbara często odwiedza wnuczęta i przy każdej okazji robi zdjęcia {{swojej|swej}} najmłodszej wnuczce.
# Wiem, że uczysz w szkole, ale nie sądziłem, że co roku jeździsz ze {{swoimi|swymi|twoimi|twymi}} uczniami w góry.
# Maria i Piotr zbierają znaczki, ale nikomu nie pokazują {{swojej|swej}} kolekcji.
# Cieszę się, że bierzecie ślub. Z radością zatańczę na {{waszym}} weselu.
# Andrzej buduje dom. Przeznaczył go dla {{swoich|swych}} synów.
# Po latach odważyłam się pokazać, co maluję. Za tydzień otwieram wystawę {{swoich|swych|moich}} obrazów.
# Musimy zmienić opiekunkę, zupełnie nie rozumie problemów {{naszych}} dzieci.`},
 {n:'V', p:12, t:'s', pts:0.5,
  ins:'Proszę przekształcić zdania zgodnie z podanym przykładem.', ua:'З’єднайте два речення в одне за допомогою «który» за зразком.',
  hint:'«który» бере рід і число від іменника в головному реченні, а відмінок — від своєї ролі в підрядному (szukać + родовий, pomóc + давальний; чий? — родовий). Прийменник ставиться перед «który». Перед «który» — кома.',
  exs:{q:'Sprzedajemy mieszkanie. Przeżyliśmy w nim dwadzieścia lat.', a:'Sprzedajemy mieszkanie, w którym przeżyliśmy dwadzieścia lat.'},
  items:[
   {q:'Znalazłem zeszyty. Szukałem ich od wczoraj.', a:['Znalazłem zeszyty, których szukałem od wczoraj.']},
   {q:'Spotkałam znajomego. Pomogłam mu kiedyś w znalezieniu pracy.', a:['Spotkałam znajomego, któremu (pomogłam kiedyś|kiedyś pomogłam) w znalezieniu pracy.']},
   {q:'Poznałem kobietę. Jej syn zginął w wypadku.', a:['Poznałem kobietę, której syn zginął w wypadku.']},
   {q:'Wychowawca rozmawia z rodzicami. Ich dzieci pojadą do Zakopanego.', a:['Wychowawca rozmawia z rodzicami, których dzieci pojadą do Zakopanego.']},
   {q:'Odwiedziłem kolegów. Chodziłem z nimi do szkoły.', a:['Odwiedziłem kolegów, z którymi chodziłem do szkoły.']}
  ]},
 {n:'VI', p:12, t:'c', pts:0.25,
  ins:'Proszę podkreślić poprawną formę wyrazu zgodnie z podanym przykładem.', ua:U.pod,
  ex:`Joanna jest [[=moja|*moją|swoją]] koleżanką od czasów szkoły podstawowej.`,
  hint:'Подвійне заперечення: nikt / nic / nikomu + nie. «lubić» із запереченням — родовий (nie lubił jej). «który» узгоджується з іменником, відмінок — від дієслова. «tę książkę» (знахідний), «tej książki» (родовий). «siebie» — родовий/знахідний, «sobą» — орудний.',
  text:`Znam [[ona|jej|*ją]] już zatem 30 lat. [[*Nikt|Żaden|Nikogo]] w klasie nie lubił [[ona|*jej|ją]], bo zawsze była najlepszą uczennicą, więc dzieci zazdrościły Joasi. Ja zaprzyjaźniłam się z [[*nią|ją|niej]] podczas wycieczki, [[który|której|*którą]] zorganizowała nasza wychowawczyni. Joasia usiadła w autobusie jak zwykle sama, a ja spóźniłam się trochę, więc nie miałam z [[czym|kogo|*kim]] usiąść. Nie lubiłam wtedy [[*siebie|sobie|sobą]] za to, że nie przyszłam na czas. Byłam nawet obrażona na [[naszą|naszej|*naszego]] kolegę, bo to on zaproponował, żebym siedziała z Joasią. Byłam tak bardzo zła, że [[nikt|*nic|nikomu]] nie powiedziałam, popatrzyłam tylko na [[jego|go|*niego]] z wyrzutem, a on zaczął się śmiać ze [[mną|*mnie|mi]]. Przez pół drogi obie milczałyśmy, aż w końcu Joasia wyciągnęła książkę i zaczęła [[jej|*ją|nią]] czytać. Okazało się, że moja sąsiadka czyta jedną z powieści Małgorzaty Musierowicz – [[*mojej|moja|moją]] ulubionej pisarki, ale [[ta|tą|*tej]] książki jeszcze nie znałam. Odważyłam się w końcu i zapytałam:
– Czy mogę od [[*ciebie|cię|tobie]] pożyczyć [[*tę|tej|ta]] książkę, [[gdzie|skąd|*kiedy]] ją już przeczytasz?
Joasia uśmiechnęła się, podała [[mnie|*mi|mną]] książkę, a sama z torby wyciągnęła kolejną. Nie zajęłyśmy się jednak lekturą, ale obie zaczęłyśmy z [[siebie|*sobą|sobie]] rozmawiać o naszych ulubionych książkach. I od [[temu|ten|*tego]] dnia zaczęła się nasza przyjaźń, która trwa już wiele lat.`}
]},

{id:'st', g:0, pl:'Stopniowanie przymiotnika i przysłówka', ua:'Ступені порівняння прикметників і прислівників', ex:[
 {n:'I', p:13, t:'c', pts:0.25,
  ins:'Proszę podkreślić poprawną formę wyrazu zgodnie z podanym przykładem.', ua:U.pod,
  ex:`Po każdym praniu ten sweter robi się [[=długi|*dłuższy|najdłuższy]].`,
  hint:'«niż» → вищий ступінь. «z całej…», «jaki w życiu…», «na roku» → найвищий. «z miesiąca na miesiąc», «po każdym…» → coraz + вищий ступінь. «nadzwyczaj» вживається зі звичайною формою.',
  text:`# Kto jest [[starszy|coraz starszy|*najstarszy]] w rodzinie - ty czy Adam?
# To był [[*najnudniejszy|coraz bardziej nudny|mniej nudny]] film, jaki w życiu widziałam.
# Jarek jest [[zmęczony|*bardziej zmęczony|najmniej zmęczony]] po balu niż po pracy.
# Przesyłam Ci [[bardziej gorące|gorętsze|*najgorętsze]] pozdrowienia i uściski.
# Jej ojciec z miesiąca na miesiąc staje się [[*coraz bardziej siwy|najmniej siwy|najbardziej siwy]].
# Z całej rodziny [[bardziej opalony|opalony|*najmniej opalony]] jest Piotrek.
# Po każdym następnym kieliszku wina Jurek stawał się [[wesoły|*coraz weselszy|najweselszy]].
# Wydaje mi się, że twój pies jest [[*bardziej posłuszny|coraz mniej posłuszny|najmniej posłuszny]] niż mój.
# Poprzedni test był nadzwyczaj [[łatwiejszy|*łatwy|mniej łatwy]].
# Adam jest bez wątpienia [[bardziej zdolnym|zdolniejszym|*najzdolniejszym]] studentem na roku.`},
 {n:'II', p:14, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:U.naw,
  ex:`Udowodniono, że ci, którzy kochają sport, są {=pewniejsi} (pewny) siebie i {=łatwiej} (łatwo) pokonują trudności.`,
  hint:'Порівняння двох («od Ewy», «od brata») → вищий ступінь. Прикметник: -szy / -ejszy (узгодьте рід), прислівник: -ej / -iej. Дієприкметникові форми на -any порівнюються описово: bardziej + слово.',
  text:`Ewa i Adam to bliźnięta. Chodzą do jednej klasy. Adam jest {{spokojniejszy}} (spokojny) od Ewy, {{częściej}} (często) się uśmiecha i jest {{bardziej wysportowany}} (wysportowany) od niej. Za to Ewa {{ładniej}} (ładnie) śpiewa i gra na gitarze oraz jest {{odważniejsza}} (odważna) od brata.`},
 {n:'III', p:14, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:U.naw,
  ex:`W szkole przyjaźniłam się z Olą, Gabrysią i Beatą. Ola była {=szczuplejsza} (szczupły) niż Gabrysia, ale Gabrysia biegała {=najszybciej} (szybko) ze wszystkich dziewcząt.`,
  hint:'«z całej grupy», «w klasie», «w całej szkole» → найвищий ступінь (naj-). «niż», «od nas» → вищий. Узгодьте прикметник з іменником (рід, число, відмінок). «dobrze» порівнюється неправильно; слова на -ący — описово (najbardziej…).',
  text:`Ja natomiast skakałam {{najwyżej}} (wysoko) z całej grupy. Beata była {{najzdolniejsza}} (zdolny) w klasie z przedmiotów artystycznych, chociaż {{lepiej}} (dobrze) rysowała niż malowała. Ola miała {{najbardziej interesujący}} (interesujący) głos w całej szkole. Wszystkie byłyśmy lubiane przez {{młodsze}} (młody) od nas koleżanki.`},
 {n:'IV', p:15, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст: утворіть вищий ступінь прикметника і порівняння (od + родовий або niż + називний) за зразком.',
  ex:`Feliks i Felicja mają troje dzieci i chyba są (szczęśliwi, sąsiedzi), którzy nie mają dzieci.
Feliks i Felicja mają troje dzieci i chyba są {=szczęśliwsi od sąsiadów}, którzy nie mają dzieci.`,
  hint:'Вищий ступінь + «od» + родовий (od Basi, od sióstr) або + «niż» + називний (niż Basia). Прикметник узгоджується з підметом. «męczący» порівнюється описово (bardziej…).',
  text:`Ich córki Ania i Basia są bliźniaczkami, ale Ania jest {{wyższa od Basi|wyższa niż Basia}} (wysoka, Basia). Syn Bartek jest {{młodszy od sióstr|młodszy niż siostry}} (młody, siostry). Czasem sąsiedzi skarżą się, że dziewczynki hałasują i są {{bardziej męczące od brata|bardziej męczące niż brat}} (męczące, brat). Bartek jest {{spokojniejszy od kolegów|spokojniejszy niż koledzy}} (spokojny, koledzy). Feliks i Felicja są lekarzami, a dzieci lekarzy zwykle są {{zdrowsze od rówieśników|zdrowsze niż rówieśnicy}} (zdrowe, rówieśnicy).`},
 {n:'V', p:15, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:U.naw,
  ex:`Pawełek i Janeczka postanowili zająć się nareszcie swoimi sprawami. Dzień wydawał się {=właściwszy} (właściwy) niż wczoraj, trudno było wybrać {=lepszy} (dobry).`,
  hint:'Усюди вищий ступінь. Прислівники: mało, krótko, długo мають форми з чергуванням (-ej). Прикметники узгоджуйте з «gruszki» (не чоловічо-особова множина: -e). «miękki» найчастіше порівнюється описово.',
  text:`Dzisiaj Janeczka i Pawełek mieli {{mniej}} (mało) lekcji, byli więc w szkole {{krócej}} (krótko). Rafał natomiast zapowiedział, że będzie zajęty {{dłużej}} (długo) i pojawi się dopiero na obiedzie. Babcia na deser przygotowała gruszki, które w tym roku były {{słodsze}} (słodki) i {{bardziej miękkie}} (miękkie) niż zwykle.`},
 {n:'VI', p:15, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:U.naw,
  hint:'«niż», «od», «o wiele», «znacznie» → вищий ступінь; «jedna z…», «w Polsce», «tamtych czasów», «należy do…» → найвищий. Потім поставте форму в потрібний відмінок і рід: «jest» + орудний, «z», «do» + родовий множини, чоловічо-особова множина -si.',
  text:`Przewodniki po Polsce informują, że Gdańsk przez setki lat był {=największym} (duży) portem nad Bałtykiem, natomiast zamek w Malborku jest {=większy} (duży) niż inne gotyckie zamki w Europie. Ratusz w Toruniu to jedna z {{najpiękniejszych|piękniejszych}} (piękny) budowli tego typu w Europie. Wśród informacji o Warszawie czytamy, że Kolumna Zygmunta jest {{najstarszym}} (stary) polskim pomnikiem przedstawiającym osobę świecką. Dalej dowiadujemy się również, że przy urządzaniu pałacyku w Wilanowie pracowali {{najlepsi}} (dobry) artyści tamtych czasów. Na temat Zamościa napisano, iż jego {{najważniejsze|ważniejsze}} (ważny) obiekty zbudowano w ciągu dwudziestu lat. Przy opisie Krakowa znajdujemy informację, że figury ołtarza w Kościele Mariackim są {{większe}} (wielki) niż rzeczywiste ludzkie postacie. W części poświęconej polskiej przyrodzie czytamy, iż Ojcowski Park Narodowy jest o wiele {{mniejszy}} (mały) od innych parków narodowych w Polsce. Napisano tam również, że drzewa w Puszczy Białowieskiej są znacznie {{wyższe}} (wysoki) i {{grubsze}} (gruby) niż w innych polskich lasach, że Hańcza jest {{najgłębszym}} (głęboki) jeziorem w Polsce, a dolina Biebrzy należy do {{najdzikszych|dzikszych}} (dziki) obszarów w naszym kraju.`},
 {n:'VII', p:16, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst poprawną formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:U.naw,
  hint:'Усюди вищий ступінь. Узгодьте прикметник з іменником: ranki — множина (-e), zieleń і piosenka — жіночий рід (-a), wszystko — середній (-e). «wesoło» — прислівник (-ej). «dobry» і «drogi» мають особливі форми.',
  text:`Być może, gdzie indziej są ziemie {=piękniejsze} (piękny),
I noce gwiaździstsze, i ranki {{jaśniejsze}} (jasny),
być może bujniejsza, {{zieleńsza}} (zielony) jest zieleń
i ptaki w gałęziach śpiewają {{weselej}} (wesoło) (...).
Być może, być może, że wszystko jest {{lepsze}} (dobry)
i ptaki, i gwiazdy, i śpiew i powietrze (...).
Być może, gdzie indziej... lecz sercu jest {{droższa}} (drogi)
piosenka znad Wisły i piasek Mazowsza.
S. R. Dobrowolski, Być może`}
]}
];
const T_WE = [
{id:'te', g:1, pl:'Odmiana czasownika w czasie teraźniejszym i przyszłym prostym', ua:'Теперішній і простий майбутній час', ex:[
 {n:'I', p:17, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst czasownikami w czasie teraźniejszym zgodnie z podanym przykładem.', ua:'Доповніть текст дієсловами в теперішньому часі за зразком.',
  hint:'Визначте підмет: Anna, Karol, pies → 3-тя особа однини; «oboje» → 3-тя особа множини. -ować / -ywać → -uje; brać → bierze; jeść → jedzą; jeździć → jeżdżą.',
  text:`Anna {=wstaje} (wstawać) zwykle bardzo wcześnie rano. Najpierw {{gimnastykuje się}} (gimnastykować się) i {{bierze}} (brać) krótką kąpiel w wannie. Kiedy Anna {{myje się}} (myć się), jej mąż Karol {{przygotowuje}} (przygotowywać) poranną kawę. Potem oboje {{jedzą}} (jeść) śniadanie. Po śniadaniu Anna zwykle {{wyprowadza}} (wyprowadzać) na spacer psa, a o siódmej oboje {{opuszczają}} (opuszczać) dom. Do pracy {{jeżdżą}} (jeździć) najczęściej tramwajem, ale w pogodne dni {{chodzą}} (chodzić) do pracy pieszo. Domu {{pilnuje}} (pilnować) pies.`},
 {n:'II', p:17, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst czasownikami w czasie teraźniejszym zgodnie z podanym przykładem.', ua:'Доповніть текст дієсловами в теперішньому часі за зразком.',
  hint:'Оповідь від 1-ї особи (ja): -ę або -am. Winda, pan Stefan → 3-тя особа однини; sąsiedzi → 3-тя особа множини (-ą). -ować → -uję / -ują; musieć → muszę; móc → mogę, może.',
  text:`Po ciężkiej pracy {=wracam} (wracać) do domu. Na uliczce pod blokiem nie {{znajduję}} (znajdować) wolnego miejsca na zaparkowanie samochodu. {{Muszę}} (Musieć) więc zostawić auto kilkadziesiąt metrów dalej. {{Wchodzę}} (Wchodzić) do klatki schodowej, {{chwytam}} (chwytać) drzwi od windy i w tym momencie winda {{rusza}} (ruszać) w górę. „Kto zabrał mi windę! Przecież w dół pan Stefan {{może|mógł}} (móc, on) zejść po schodach” – {{myślę|myślałam}} (myśleć, ja) ze złością. Sąsiedzi {{potrafią}} (potrafić) zepsuć humor nawet wtedy, gdy nie {{robią}} (robić) niczego złego. Czasem {{denerwują}} (denerwować) nas samą swoją obecnością.`},
 {n:'III', p:18, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst czasownikami w czasie teraźniejszym zgodnie z podanym przykładem.', ua:'Доповніть текст дієсловами в теперішньому часі за зразком.',
  hint:'Заперечення «być» у значенні наявності: nie ma + родовий. Rosa говорить про себе (ja) і про себе з подругою (my). Sąsiedzi, jedni, inni, panie → 3-тя особа множини. śmiać się → śmieją się, piec → pieką, bać się → boję się, brać → biorę.',
  text:`A: Przepraszam, czy {=rozmawiam} (rozmawiać) z panią Ewą?
B: W tej chwili {{nie ma}} (nie być) jej w domu.
A: Jestem studentką pani Ewy i {{potrzebuję}} (potrzebować) jej pomocy.
B: Proszę zadzwonić później. Mama powinna wrócić około dziewiątej. A może ja {{mogę}} (móc) pani pomóc?
A: Bardzo pani miła. Pozwoli pani, że się przedstawię. {{Mam}} (Mieć) na imię Rosa i {{mieszkam}} (mieszkać) razem z moją koleżanką z Brazylii w akademiku dla cudzoziemców, na dziewiątym piętrze. Codziennie {{kładziemy się}} (my – kłaść się) spać o trzeciej nad ranem i dlatego zawsze {{spóźniam się|spóźniamy się}} (spóźniać się) na zajęcia. A to dlatego, że nasi sąsiedzi okropnie {{hałasują}} (hałasować). Jedni {{jeżdżą}} (jeździć) rowerami po korytarzu, inni {{krzyczą}} (krzyczeć) lub głośno {{śmieją się}} (śmiać się), jeszcze inni {{trenują}} (trenować) karate lub przez całą noc {{pieką}} (piec) i {{jedzą}} (jeść) jakieś potrawy. Już tego {{nie wytrzymujemy}} (my – nie wytrzymywać)! {{Boję się}} (ja – Bać się), że jeśli się nie wyprowadzimy, to niedługo zwariujemy. Moja koleżanka od kilku dni {{płacze}} (płakać), tak jest zmęczona tą sytuacją. Może panie {{wiedzą}} (wiedzieć), jak znaleźć niedrogie mieszkanie niedaleko szkoły?
B: Proszę przygotować kartkę i długopis. Podam pani numer telefonu mojej koleżanki ze studiów, która właśnie {{poszukuje}} (poszukiwać) współlokatorek.
A: Już {{biorę}} (brać)! Gotowe, słucham panią.
B: Nazywa się Małgorzata Zasadzińska, tel. 0 - 42 - 667 - 985.
A: Bardzo, bardzo dziękuję. Do widzenia!
B: Do widzenia.`},
 {n:'IV', p:19, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst czasownikami w czasie teraźniejszym zgodnie z podanym przykładem.', ua:'Доповніть текст дієсловами в теперішньому часі за зразком.',
  hint:'Особа вказана в дужках (ty, my, wy). Де її немає — шукайте підмет: sekundy, naukowcy → 3-тя особа множини; ono → 3-тя однини. «Kilkadziesiąt tysięcy Polaków» + дієслово в 3-й особі однини. stać → stoi, móc → możecie.',
  text:`Po zrobieniu zakupów {=wychodzisz} (wychodzić, ty) na parking przed supermarketem i długo {{rozglądasz się|się rozglądasz}} (ty – rozglądać się) w poszukiwaniu auta. {{Mijają}} (Mijać) sekundy, potem minuty. W głowie pustka. „Gdzie ono {{stoi}} (stać)?” – {{denerwujesz się}} (ty – denerwować się). Codziennie kilkadziesiąt tysięcy Polaków {{łapie}} (łapać) się na tym. {{Mamy}} (my – Mieć) jednak dobrą wiadomość: {{możecie}} (wy – móc) ulepszyć swą pamięć! Naukowcy {{polecają}} (polecać) proste ćwiczenia – także gimnastyczne! Bieganie, podobnie jak inne sporty {{poprawiają}} (poprawiać) również pracę umysłu. Nie {{wierzycie}} (wy – wierzyć)? Są na to dowody! Potwierdza się stara prawda, że w zdrowym ciele zdrowy duch.`}
]},

{id:'pr', g:1, pl:'Odmiana czasownika w czasie przeszłym', ua:'Минулий час', ex:[
 {n:'I', p:19, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst czasownikami w czasie przeszłym zgodnie z podanym przykładem.', ua:'Доповніть текст дієсловами в минулому часі за зразком.',
  hint:'Рід і число беріть від підмета: Tomasz, Adam → -ł; Anna → -ła; Beata i Anna, siostry (жінки) → -ły; «wy» про жінок → -łyście; «nic» → середній рід -ło. wziąć → wzięła, krzyknąć → krzyknęła, przyjść → przyszły.',
  text:`Tomasz {=miał} (mieć) wczoraj urodziny i {{zaprosił}} (zaprosić) na przyjęcie wszystkich swych przyjaciół. Beata i Anna jak zwykle się {{spóźniły}} (spóźnić), a w dodatku {{zapomniały}} (zapomnieć) o prezencie.
Beata: „{{Myślałam}} (myśleć), że ty go {{wzięłaś}} (wziąć), Aniu!”
Ania: „To twoja wina!” – {{krzyknęła}} (krzyknąć) na siostrę Anna.
Tomasz: „Dajcie spokój. Nic się przecież nie {{stało}} (stać)”.
„Najważniejsze, że wy {{przyszłyście}} (przyjść)” – {{zapewniał}} (zapewniać) Adam.
Siostry przez cały wieczór {{czuły}} (czuć) się jednak źle.`},
 {n:'II', p:20, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst czasownikami w czasie przeszłym zgodnie z podanym przykładem.', ua:'Доповніть текст дієсловами в минулому часі за зразком.',
  hint:'Авторка — жінка: ja → -łam. Mama, pani Halinka → -ła; pan Stanisław, pan Kazio → -ł; my (мішана група) → -liśmy. rozpocząć → rozpoczęła, znaleźć → znaleźli, zanieść → zaniósł, piec → piekła.',
  text:`Gdy {=miałam} (mieć, ja) 7 lat, {{mieszkałam|mieszkaliśmy}} (mieszkać) z mamą i dwoma młodszymi braćmi. W tym czasie mama {{pracowała}} (pracować) w banku, a oprócz tego {{rozpoczęła}} (rozpocząć) studia podyplomowe. {{Miała}} (Mieć) dla nas mało czasu. Niespodziewanie {{znaleźliśmy}} (znaleźć, my) pomoc i przyjaźń u naszych sąsiadów, państwa Hanny i Stanisława Korniaków. Pan Stanisław pomimo choroby zawsze {{znajdował}} (znajdować) siłę i czas, by się z nami pobawić. Ich syn, pan Kazio, {{uratował}} (uratować) mi życie, gdy zimą {{zaniósł}} (zanieść) mnie na rękach do ośrodka zdrowia. Jego siostra, pani Halinka, {{piekła}} (piec) nam urodzinowe torty. Może to zwykłe historie, ale dla mnie bardzo ważne. Teraz mam 22 lata i własną rodzinę, ale do dziś jestem wdzięczna za wszystko Państwu Korniakom i pisząc ten list, {{chciałam}} (chcieć) im podziękować.`},
 {n:'III', p:20, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst czasownikami w czasie przeszłym zgodnie z podanym przykładem.', ua:'Доповніть текст дієсловами в минулому часі за зразком.',
  hint:'Tomek — чоловік: ja → -łem, ty → -łeś; my, wy, koledzy → -liśmy, -liście, -li. Безособове «okazało się», «zależało» → середній рід. iść: poszedł / poszła / przyszli; zacząć → zaczęliśmy; zająć → zająłem; zjeść → zjadłem; znaleźć → znaleźli.',
  text:`Ala: Tomek, co {=robiłeś} (robić, ty) w sobotę wieczorem? Czy {{poszedłeś}} (pójść, ty) w końcu na ten nowy film Almodóvara?
Tomek: O siódmej {{przyszła}} (przyjść) do mnie Marysia, z którą {{miałem}} (mieć) pójść do kina. Jednak, kiedy {{zaczęliśmy}} (zacząć, my) szykować się do wyjścia, {{okazało się}} (okazać się), że {{zginął}} (zginąć) mi klucz od mieszkania. Po prostu jak kamień w wodę, nigdzie nie {{mogliśmy}} (móc – my) go znaleźć.
Ala: To znaczy, że {{przesiedzieliście}} (przesiedzieć, wy) cały wieczór w domu?
Tomek: Beacie bardzo {{zależało}} (zależeć) na tym filmie, więc {{poszła}} (pójść) do kina sama, a ja najpierw coś {{zjadłem}} (zjeść), a potem {{zająłem się}} (zająć się) pisaniem pracy semestralnej.
Ala: A co z kluczem?
Tomek: W niedzielę rano {{przyszli}} (przyjść) do mnie koledzy i {{znaleźli}} (znaleźć) go pod stołem.`},
 {n:'IV', p:21, t:'s', pts:1,
  ins:'Proszę przekształcić zdania zgodnie z podanym przykładem.', ua:'Перепишіть речення, звертаючись до іншої особи (слово під реченням), за зразком.',
  hint:'Змініть звертання й усі дієслова минулого часу: жінки → -łyście / -ły, чоловіки → -liście / -li, один чоловік → -łeś / -ł. До «pan / pani / państwo» дієслово стоїть у 3-й особі. iść: wyszedł / wyszła / wyszli / wyszły.',
  exs:{q:'Aniu, dlaczego nie wyszłaś z psem na spacer? Nie wiedziałaś, że wrócę późno?', c:'Marku', a:'Marku, dlaczego nie wyszedłeś z psem na spacer? Nie wiedziałeś, że wrócę późno?'},
  items:[
   {q:'Drodzy koledzy, mieliście wyjść z przyjęcia o ósmej, więc dlaczego wyszliście o północy?', c:'Drogie koleżanki', a:['Drogie koleżanki, miałyście wyjść z przyjęcia o ósmej, więc dlaczego wyszłyście o północy?']},
   {q:'Dlaczego mi panowie nie powiedzieli, że nie zanieśli panowie tych dokumentów do sekretariatu?', c:'pan', a:['Dlaczego mi pan nie powiedział, że nie zaniósł (pan |)tych dokumentów do sekretariatu?']},
   {q:'Proszę pani, najpierw pani wysiadła na złym przystanku, a potem przeszła ulicę na czerwonym świetle!', c:'Moi panowie', a:['Moi panowie, najpierw panowie wysiedli na złym przystanku, a potem przeszli ulicę na czerwonym świetle!']},
   {q:'Nie mogłyście, czy nie chciałyście powiedzieć prawdy?', c:'państwo', a:['Nie mogli państwo czy nie chcieli powiedzieć prawdy?']},
   {q:'Koledzy, dlaczego nie zajęliście nam miejsc? Musiałyśmy stać w czasie koncertu.', c:'Tomku / ja', a:['Tomku, dlaczego nie zająłeś mi miejsca? (Musiałem|Musiałam) stać w czasie koncertu.']}
  ]},
 {n:'V', p:22, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst nr II formą czasu przeszłego czasowników podkreślonych w tekście nr I zgodnie z podanym przykładem.', ua:'Доповніть текст II формами минулого часу дієслів, підкреслених у тексті I, за зразком.',
  hint:'Пані Анна планує від 1-ї особи, а в тексті II про все розповідають у 3-й особі: ona → -ła, on → -ł, Zosia i Kasia → -ły, oni → -li. «nie ma» → «nie było». wziąć → wzięła / wziął, iść → wyszły / wyszedł / doszedł, jeść → zjedli.',
  note:'П. 11: у ключі «zebrali się», але «się» вже надруковано в тексті після пропуску — приймаються обидва записи.',
  pre:`Tekst I
Pani Anna planuje dzień swojej rodziny:
Jutro __wstanę__^0^ wcześniej niż zwykle. __Muszę zrobić__^1^ zakupy, bo w lodówce nic __nie ma__^2^. Przy okazji __wezmę__^3^ Reksa na spacer. Niestety, __nie mogę__^4^ liczyć na Piotra, bo __musi__^5^ leżeć w łóżku. O wpół do ósmej Zosia i Kasia __wyjdą__^6^ do szkoły, a Piotruś __wyjdzie__^7^ dopiero o jedenastej. __Weźmie__^8^ ze sobą duże drugie śniadanie, bo tego dnia __ma__^9^ dużo lekcji. Ja __pobiegnę__^10^ do pracy zaraz po jego wyjściu. Wszyscy __zbierzemy__^11^ się razem dopiero wieczorem. __Zjemy__^12^ kolację i __opowiemy__^13^ sobie o tym, co przydarzyło się nam tego dnia. Mam nadzieję, że Piotr do tego czasu __dojdzie do siebie__^14^.`,
  text:`Tekst II
Następnego dnia wieczorem okazało się, że wszystko przebiegało zgodnie z planem.
Pani Anna {=wstała} wcześniej niż zwykle. [Ona] {{musiała}} zrobić zakupy, bo w lodówce {{nie było}} nic. Przy okazji [ona] {{wzięła}} Reksa na spacer. Niestety, pani Anna nie {{mogła}} liczyć na Piotra, bo {{musiał}} leżeć w łóżku. O wpół do ósmej Zosia i Kasia {{wyszły}} do szkoły, a Piotruś {{wyszedł}} dopiero o jedenastej. [On] {{wziął}} ze sobą duże drugie śniadanie, bo tego dnia {{miał}} dużo lekcji. Anna {{pobiegła}} do pracy zaraz po jego wyjściu. Wszyscy [oni] {{zebrali|zebrali się}} się razem dopiero wieczorem. [Oni] {{zjedli}} kolację i {{opowiedzieli}} sobie o tym, co przydarzyło im się tego dnia. A Piotr, mąż pani Anny, do tego czasu {{doszedł}} do siebie.`}
]},

{id:'as', g:1, pl:'Aspekt czasownika', ua:'Вид дієслова (доконаний / недоконаний)', ex:[
 {n:'I', p:22, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą jednego z czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою одного з дієслів у дужках за зразком.',
  hint:'Тривала або повторювана дія в минулому («ciągle», «chętnie») → недоконаний вид. Підсумок за рік → доконаний. Майбутнє: недоконаний — będą + інфінітив, доконаний — проста форма. Узгодьте рід: Polacy → -li, salony → -ły.',
  text:`Ostatni rok nie był rokiem dobrym dla producentów i sprzedawców samochodów w Polsce. Chociaż salony motoryzacyjne ciągle {=kierowały} (kierować/skierować) do klientów nowe, atrakcyjne oferty, to jednak Polacy nie {{decydowali się}} (decydować się/zdecydować się) na zakup nowego samochodu. Natomiast bardzo chętnie {{kupowali}} (kupować/kupić) samochody używane z zagranicy. W ubiegłym roku salony samochodowe w Polsce {{sprzedały}} (sprzedawać/sprzedać) o blisko połowę nowych aut mniej.
Czy na naszych drogach będzie bezpieczniej?
Jedno jest pewne. W najbliższych latach po naszych drogach {{będą jeździć|będą jeździły}} (jechać/jeździć) coraz starsze samochody. Ale czy to ostatecznie {{spowoduje}} (powodować/spowodować) większą ilość wypadków drogowych? Nie wiadomo.`},
 {n:'II', p:23, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą jednego z czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою одного з дієслів у дужках за зразком.',
  ex:`Zwykle Maria sama {=robiła} (robić/zrobić) zakupy, ale wczoraj źle się czuła.`,
  hint:'Одноразові завершені дії вчора → доконаний вид. Слова «długo», «przez kilka minut» і «kiedy…» (тло для іншої дії) → недоконаний. «w końcu» → доконаний. Maria → -ła, Marek → -ł.',
  text:`{{Poprosiła}} (Prosić/Poprosić) o pomoc męża i to Marek {{poszedł}} (iść/pójść) do sklepu. {{Wziął}} (Brać/Wziąć) ze sobą tylko 40 zł, bo od dawna nie był w sklepie i nie wiedział, co ile kosztuje. Najpierw długo {{oglądał}} (oglądać/obejrzeć) mięso i wędliny, aż w końcu {{kupił}} (kupować/kupić) kilogram szynki. Potem przez kilka minut {{wybierał}} (wybierać/wybrać) warzywa, ale nic nie kupił, bo {{zapomniał}} (zapominać/zapomnieć), o co prosiła żona. W końcu {{włożył}} (wkładać/włożyć) do koszyka jeszcze cztery chleby, kilogram sera i dwa masła. Kiedy {{płacił}} (płacić/zapłacić) za zakupy, okazało się, że zabrakło mu pieniędzy. Nie wiedział, z czego zrezygnować, więc wszystko {{zostawił}} (zostawiać/zostawić) w sklepie.`},
 {n:'III', p:23, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą jednego z czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою одного з дієслів у дужках за зразком.',
  hint:'Авторка — жінка (-łam). «zwykle», «pilnie», «codziennie» → недоконаний вид («codziennie… i mówię» — теперішній час). Рішення та одноразові події (закінчила, виїхала, знайшла) → доконаний. Після «aby ktoś» — форма на -ł.',
  text:`Kiedy byłam dzieckiem, rodzice często się {=kłócili} (kłócić/pokłócić). Wieczorem, gdy zaczynali się awanturować, marzyłam, aby ktoś mnie {{zabrał}} (zabierać/zabrać) z domu. Zwykle {{słyszałam}} (słyszeć/usłyszeć) złośliwe komentarze na swój temat i było mi bardzo przykro. {{Postanowiłam}} (Postanowić/Postanawiać) więc udowodnić, że dzieci, które nigdy nie zaznały miłości, mogą wyrosnąć na porządnych ludzi. Gdy {{skończyłam}} (kończyć/skończyć) szkołę średnią, {{wyjechałam}} (wyjeżdżać/wyjechać) z domu. {{Znalazłam}} (Znajdować/Znaleźć) pracę i równocześnie pilnie {{uczyłam się}} (uczyć się/nauczyć się). Dziś jestem szczęśliwą żoną i matką. Codziennie {{przytulam}} (przytulać/przytulić) synka i mówię mu, że go kocham.`},
 {n:'IV', p:24, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą jednego z czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою одного з дієслів у дужках за зразком.',
  hint:'Ланцюжок одноразових дій одна за одною → доконаний вид (-ła). Після «chciała» — інфінітив. «W chwili gdy…», «Już…, gdy…» можуть описувати дію в процесі (недоконаний).',
  text:`Anna była bardzo zmęczona, więc {=postanowiła} (postanawiać/postanowić) położyć się wcześniej spać.
Zaraz po przyjściu z pracy {{wzięła}} (brać/wziąć) prysznic i mimo że była dopiero siódma, {{poszła}} (iść/pójść) do sypialni. W chwili gdy {{kładła się|położyła się}} (kłaść się/położyć się) do łóżka, {{zadzwonił}} (dzwonić/zadzwonić) telefon. Anna {{podniosła}} (podnosić/podnieść) słuchawkę. To była pomyłka. Znów {{znalazła się}} (znajdować się/znaleźć się) w łóżku. Już {{zamykała|zamknęła}} (zamykać/zamknąć) oczy, gdy {{usłyszała}} (słyszeć/usłyszeć) pukanie do drzwi. {{Wstała}} (Wstawać/Wstać) niechętnie, {{założyła}} (zakładać/założyć) szlafrok, {{podeszła}} (pochodzić/podejść) do drzwi i {{otworzyła}} (otwierać/otworzyć) je. Na korytarzu {{zobaczyła}} (widzieć/zobaczyć) sąsiadkę ze szklanką w ręku. Chciała {{pożyczyć}} (pożyczać/pożyczyć) trochę soli. Anna {{uśmiechnęła się}} (uśmiechać się/uśmiechnąć się), {{nasypała}} (nasypywać/nasypać) soli do szklanki i {{oddała}} (oddawać/oddać) ją sąsiadce. Potem {{włączyła}} (włączać/włączyć) telewizor, {{obejrzała}} (oglądać/obejrzeć) wiadomości, film i jakiś program. Anna {{usnęła}} (usypiać/usnąć) dopiero przed północą.`},
 {n:'V', p:25, t:'s', pts:0.5,
  ins:'Proszę uzupełnić tabelę czasownikami w czasie przeszłym dokonanym zgodnie z podanym przykładem.', ua:'Доповніть таблицю: запишіть те саме дієсловом доконаного виду в минулому часі, від 1-ї особи (жінка), за зразком.',
  hint:'Знайдіть доконану пару: pisać → napisać, oglądać → obejrzeć, opowiadać → opowiedzieć, kłaść → położyć, brać → wziąć; інші утворюються префіксом (z-, wy-, prze-, za-, pod-). Форма: 1-ша особа, жіночий рід (-łam).',
  pre:`Beata spędzała czas na wakacjach bardzo monotonnie. Wczoraj napisała do Magdy list, w którym opisała to, co wczoraj zrobiła.
Co Beata robiła wczoraj wieczorem? → Co zrobiłam wczoraj wieczorem?`,
  exs:{q:'pisała list', a:'Napisałam list.'},
  items:[
   {q:'oglądała film', a:['obejrzałam film']},
   {q:'opowiadała bajkę córce', a:['opowiedziałam bajkę córce']},
   {q:'kładła dziecko spać', a:['położyłam dziecko spać']},
   {q:'prała bieliznę', a:['(wyprałam|uprałam|przeprałam) bieliznę']},
   {q:'czytała listy od przyjaciółki', a:['przeczytałam listy od przyjaciółki']},
   {q:'dzwoniła do matki', a:['zadzwoniłam do matki']},
   {q:'robiła kolację', a:['zrobiłam kolację']},
   {q:'piła mleko z miodem', a:['wypiłam mleko z miodem']},
   {q:'podlewała kwiaty', a:['podlałam kwiaty']},
   {q:'brała prysznic', a:['wzięłam prysznic']}
  ]},
 {n:'VI', p:25, t:'b', pts:0.75,
  ins:'Proszę uzupełnić tekst formami czasu przyszłego odpowiednich czasowników z ramki zgodnie z podanym przykładem. Uwaga! Każdy wyraz może być użyty tylko raz.', ua:'Доповніть текст формами майбутнього часу відповідних дієслів із рамки за зразком. Увага! Кожне слово можна вжити лише раз.',
  bank:['jeździć/jechać/pojechać','kupować/kupić','robić/zrobić','grać/zagrać','latać/lecieć/polecieć','zaczynać/zacząć','kończyć/skończyć','pracować/','zdawać/zdać','wracać/wrócić','studiować/'],
  hint:'Одноразова дія з результатом → доконаний вид, проста форма (zdadzą, wróci). Тривала або повторювана дія («przez pięć lat», «od czerwca do września», «przez całe lata», «w każde wakacje») → недоконаний: będzie / będziemy + інфінітив або форма на -ł.',
  text:`Tomek: Jak sądzisz, jak zmieni się nasze życie, gdy {=skończymy} szkołę średnią?
Anka: Nietrudno przewidzieć, że Agnieszka i Mateusz, świetnie {{zdadzą}} maturę i wkrótce {{zaczną}} wymarzone studia. Agnieszka przez pięć lat {{będzie studiowała|będzie studiować}} matematykę i filozofię w którymś z europejskich uniwersytetów i trzy lata później, albo jeszcze wcześniej, {{zrobi}} doktorat. A Mateusz...
Tomek: Mówił mi, że najpierw {{pojedzie}} do Anglii, żeby zarobić na nową gitarę.
Anka: A jak chce to zrobić?
Tomek: Od czerwca do września {{będzie grał|będzie grać}} w londyńskich klubach bluesowych. Zaprosili go ci Brytyjczycy, których poznał na konkursie „Kocham bluesa”. Ale po wakacjach {{wróci}} do Polski, żeby zacząć studia w szkole muzycznej w Katowicach. Jako laureat konkursu miejsce ma tam już zapewnione.
Anka: A my, jako klasowi średniacy i dzieci niebogatych rodziców, przez całe lata {{będziemy pracowali|będziemy pracować}} wieczorami w jakichś pubach lub barach, żeby zarobić na pieniądze na studia w prywatnej uczelni.
Anka: Ale w każde wakacje {{będziemy latali|będziemy latać}} do Londynu, oczywiście tanimi liniami, i słuchać gry Mateusza na tej gitarze, którą {{kupi}} sobie w te wakacje.
Tomek: Spotkania naszej klasy w Londynie! To brzmi nieźle.
Anka: Też tak myślę.`}
]},

{id:'ro', g:1, pl:'Tryb rozkazujący', ua:'Наказовий спосіб', ex:[
 {n:'I', p:26, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб, ty) за зразком.',
  pre:`Oto horoskop na nadchodzący tydzień:`,
  ex:`{=Postaraj się} (postarać się) zacząć dobrze tydzień.`,
  hint:'Форма «ty»: відкиньте закінчення 3-ї особи. Дієслова на -ać (-ają) → -aj; -ować → -uj; wstać → wstaną → wstań; przyjrzeć się → przyjrzy się → przyjrzyj się. Не забудьте «się».',
  text:`11 maja {{wstań}} (wstać) prawą nogą i nie {{oglądaj się}} (oglądać się) na to, co już za Tobą. {{Skoncentruj się}} (Skoncentrować się) na tym, co robisz. {{Uważaj}} (Uważać) na finanse. Problemy nie rozwiążą się same, uważnie {{przyjrzyj się}} (przyjrzeć się) bezlitosnym cyfrom.`},
 {n:'II', p:27, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб, wy) за зразком.',
  ex:`{=Rozwiążcie} (Rozwiązać) wszystkie zadania.`,
  hint:'Форма «wy» = форма «ty» + -cie: wpisz → wpiszcie, wyślij → wyślijcie, sprawdź → sprawdźcie. -ować → -ujcie.',
  note:'П. 5: у ключі «kontaktujcie» (без «się»); повна правильна форма — «kontaktujcie się». Приймаються обидві.',
  text:`Odpowiedzi {{wpiszcie}} (wpisać) na kartkę pocztową, {{naklejcie}} (nakleić) też na nią wypełniony kupon konkursowy i {{wyślijcie}} (wysłać) na adres redakcji. {{Sprawdźcie}} (Sprawdzić) nazwiska zwycięzców w lutowym numerze naszego pisma. Nie {{kontaktujcie się|kontaktujcie}} (kontaktować się) z nami telefonicznie w celu uzyskania informacji.`},
 {n:'III', p:27, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб, ty) за зразком.',
  ex:`{=Śmiej się} (Śmiać się) często.`,
  hint:'Форма «ty» від основи теперішнього / майбутнього часу: pokaże → pokaż, zapłaci → zapłać, wybierze → wybierz, podleje → podlej. o → ó: pomoże → pomóż. Нерегулярне: wziąć → weź.',
  text:`Kochana Ewuniu!
Niespodziewanie muszę wyjechać na kilka dni w delegację. Nie mogłam Cię o tym wcześniej uprzedzić. Bardzo Cię proszę o załatwienie kilku spraw:
# (pokazać) {{pokaż}} Zuzi Lublin,
# (wyprowadzić) {{wyprowadź}} psa na spacer,
# (zapłacić) {{zapłać}} rachunki na poczcie,
# (pomóc) {{pomóż}} babci ugotować obiad,
# (wybrać) {{wybierz}} pieniądze z bankomatu,
# (odebrać) {{odbierz}} z pralni płaszcz,
# (podlać) {{podlej}} kwiatki w ogrodzie,
# (ubrać się) {{ubierz się}} elegancko do teatru,
# (wziąć) {{weź}} ze sobą Zuzię,
# (zadzwonić) {{zadzwoń}} do mnie wieczorem na komórkę!
Całuję mocno
Mama`},
 {n:'IV', p:28, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб, ty) за зразком.',
  hint:'Форма «ty»: wziąć → weź, wyjść → wyjdź, zrobić → zrób (o → ó), -ować → -uj, -ać → -aj, umyć → umyj, podrzeć → podrzyj, rzucić → rzuć.',
  text:`Jak pokonać złość?
Jeśli tylko możesz i wiesz, że nikogo tym nie skrzywdzisz, {=mów} (mówić) głośno o swojej złości. {{Weź}} (Wziąć) kilka oddechów, {{wyjdź}} (wyjść) na świeże powietrze i {{maszeruj}} (maszerować) szybkim krokiem przez 15 minut. {{Zrób}} (Zrobić) wielkie pranie i porządki w szafach, {{pozmywaj}} (pozmywać) naczynia i {{umyj}} (umyć) okna. {{Zadzwoń}} (Zadzwonić) do przyjaciółki i {{wygadaj się}} (wygadać się) przez telefon. {{Podrzyj}} (Podrzeć) na kawałki kilka starych gazet i {{rzuć}} (rzucić) czymś miękkim o ścianę. Zobaczysz, że poczujesz się lepiej.`},
 {n:'V', p:28, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб; особа вказана) за зразком.',
  hint:'Особа — в дужках. wy: форма «ty» + -cie. ty: przyjść → przyjdź, być → bądź, pomóc → pomóż. Для 3-ї особи (on): niech + теперішній / майбутній час (niech przyjdzie).',
  text:`Jeśli chcecie otrzymać pracę, {=umówcie się} (umówić się, wy) na rozmowę z dyrektorem i nie {{zapomnijcie}} (zapomnieć, wy) o najprostszych zasadach.
Oto kilka z nich:
- {{przyjdź}} (przyjść, ty) punktualnie,
- {{wyłącz}} (wyłączyć, ty) telefon komórkowy,
- nie {{zaczynaj}} (zaczynać, ty) rozmowy od pytania o pieniądze,
- dobrze {{przemyśl}} (przemyśleć, ty) każdą odpowiedź,
- nie {{okazuj}} (okazywać, ty) zdenerwowania,
- {{bądź}} (być, ty) pewny siebie,
- {{pomóż}} (pomóc, ty) znaleźć dyrektorowi odpowiednią osobę,
- {{niech pozna}} (poznać, on) cię jak najlepiej i
- {{niech zadzwoni}} (zadzwonić, on) właśnie do ciebie!`},
 {n:'VI', p:29, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб, my) за зразком.',
  hint:'Форма «my» = форма «ty» + -my: planuj → planujmy, ustal → ustalmy, znajdź → znajdźmy, walcz → walczmy. Дієслова на -ać → -ajmy.',
  note:'П. 5: у ключі «Nauczmy» (без «się»); повна правильна форма — «Nauczmy się». Приймаються обидві.',
  text:`Aby dobrze gospodarować czasem, powinniśmy przestrzegać pewnych zasad. Najważniejsza z nich brzmi: {=spieszmy się} (spieszyć się – my) powoli.
A oto pozostałe:
- Dobrze się {{wysypiajmy}} (wysypiać – my) i {{planujmy}} (planować – my) swoje zajęcia.
- Nie {{odkładajmy}} (odkładać – my) niczego na ostatnią chwilę i {{ustalmy}} (ustalić – my), co jest dla nas w życiu ważne.
- {{Nauczmy się|Nauczmy}} (Nauczyć się – my) też wreszcie odmawiać i {{znajdźmy}} (znaleźć – my) czas na odpoczynek.
- Nie {{poganiajmy}} (poganiać – my) siebie i codziennie {{walczmy}} (walczyć – my) z tak zwanymi złodziejami czasu.
- Nie {{oglądajmy}} (oglądać – my) całymi dniami telewizji i nie {{plotkujmy}} (plotkować – my) godzinami przez telefon.`},
 {n:'VII', p:29, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб, wy) за зразком.',
  hint:'Учитель звертається до групи → форма «wy» (-cie): iść → idź → idźcie, wziąć → weź → weźcie, zrobić → zrób → zróbcie. Заперечення й «się» зберігаються.',
  text:`Przed wycieczką nauczyciel zwrócił się do grupy uczniów:
Kochani, nie {=żujcie} (żuć) gumy! Plecaki {{zostawcie}} (zostawić) w szatni! W czasie zwiedzania {{idźcie}} (iść) w grupie i {{nie oddalajcie się}} (nie oddalać się) ode mnie! {{Weźcie}} (Wziąć) tylko notesy i długopisy, a aparaty niech zostaną w szatni. Zdjęcia {{zróbcie}} (zrobić) albo przed wejściem do muzeum, albo potem.`},
 {n:'VIII', p:30, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою одного з дієслів у дужках (наказовий спосіб + вибір виду) за зразком.',
  hint:'Спершу вид: регулярна дія («codziennie», «co dwa dni», «co rano») → недоконаний; одноразова («w piątek», «we wtorek», «w sobotę rano») → доконаний. Потім особа: до одного — ty, до «Kochani», «Dzieci» — wy (-cie).',
  text:`Barbara musiała wyjechać na tydzień. Swoje obowiązki domowe rozdzieliła między męża i dzieci. Oto list, który im zostawiła:
Jacku, we wtorek {=umów się} (umawiać się/umówić się) na wizytę u dentysty, a ty, Aniu, codziennie {=zażywaj} (zażywać/zażyć) leki przeciwalergiczne!
Kochani, {{pamiętajcie}} (pamiętać/zapamiętać) o codziennym sprzątaniu swoich pokoi!
Aniu, co dwa dni {{podlewaj}} (podlewać/podlać) kwiaty!
Jacku, {{wyprowadzaj}} (wyprowadzać/wyprowadzić) psa co rano!
Marku, {{zrób}} (robić/zrobić) zakupy w piątek i koniecznie {{kup}} (kupować/kupić) prezent dla cioci!
Dzieci, {{odwiedźcie}} (odwiedzać/odwiedzić) we wtorek babcię i {{oddajcie}} (oddawać/oddać) jej ten niebieski garnek!
Drogi Mężu, {{zapłać}} (płacić/zapłacić) rachunek za telefon!
Córeczko, w sobotę rano {{wykąp}} (kąpać/wykąpać) psa!
Kochani, {{dzwońcie}} (dzwonić/zadzwonić) do mnie codziennie!
Kocham Was
Mama`},
 {n:'IX', p:30, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів (наказовий спосіб, ty) за зразком. Інфінітив із лівої колонки збірника подано в дужках.',
  info:'У збірнику ця вправа помилково позначена номером «XI» (с. 30); за порядком і ключем це вправа IX. Дві колонки збірника зведено в один список.',
  pre:`Porady dla turysty wybierającego się za granicę.
Przed wyjazdem za granicę trzeba: → Turysto, gdy wybierasz się za granicę:`,
  ex:`(Dowiedzieć się) {=Dowiedz się} jak najwięcej o kraju, do którego jedziesz;`,
  hint:'Форма «ty»: -ować → -uj; wykupić → wykup; zabrać → zabierz; zrobić → zrób; sprawdzić → sprawdź. Нерегулярні: wziąć → weź, mieć → miej, być → bądź.',
  text:`# (przygotować) {{przygotuj}} adresy i telefony polskich konsulatów i ambasad;
# (wykupić) {{wykup}} ubezpieczenie;
# (wziąć) {{weź}} ze sobą adresy i numery telefonów bliskich w Polsce;
# (aktywować) {{aktywuj}} usługę roamingu i Poland Direct;
# (zabrać) {{zabierz}} karty płatnicze, czeki podróżne i gotówkę;
# (zanotować) {{zanotuj}} numery kart płatniczych i czeków podróżnych;
# (zrobić) {{zrób}} kserokopie dokumentów, które zabierasz ze sobą;
# (sprawdzić) {{sprawdź}} datę ważności paszportu;
# (mieć) {{miej}} ze sobą kilka zdjęć paszportowych;
# (być) {{bądź}} na lotnisku dwie godziny przed odlotem.`},
 {n:'X', p:31, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników zgodnie z podanym przykładem.', ua:'Доповніть текст: замініть підкреслені інфінітиви з рецепта на наказовий спосіб (ty) за зразком.',
  ex:`Pomidory __zalać__^0^ wrzątkiem.
Pomidory {=zalej} wrzątkiem.`,
  hint:'Форма «ty»: rozgrzać → rozgrzeje → rozgrzej; dodać → dodaj; smażyć → smaż; mieszać → mieszaj; zmniejszyć → zmniejsz.',
  pre:`SOS POMIDOROWY
3/4 kg zielonej fasolki szparagowej
5 średnich pomidorów bez skóry
ząbek czosnku
olej, sól, pieprz
Na patelni __rozgrzać__^1^ olej, __dodać__^2^ drobno pokrojony czosnek. Dodać drobno pokrojone w kostkę pomidory, oraz sól, pieprz. __Smażyć__^3^ i __mieszać__^4^ ok. 8 min. __Zmniejszyć__^5^ ogień, wrzucić fasolę, wymieszać i danie gotowe. Można dodać świeże zioła: bazylię, oregano. Sos najlepiej smakuje z plackami ziemniaczanymi.`,
  text:`Na patelni {{rozgrzej}} olej, {{dodaj}} drobno pokrojony czosnek. Dodać drobno pokrojone w kostkę pomidory, oraz sól, pieprz. {{Smaż}} i {{mieszaj}} ok. 8 min. {{Zmniejsz}} ogień, wrzucić fasolę, wymieszać i danie gotowe. Można dodać świeże zioła: bazylię, oregano. Sos najlepiej smakuje z plackami ziemniaczanymi.`},
 {n:'XI', p:32, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą czasowników w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст правильною формою дієслів у дужках (наказовий спосіб, ty) за зразком.',
  hint:'Форма «ty»: wrzucić → wrzuć, wybrać → wybierz, poczekać → poczekaj. Після збігу приголосних додається -ij: przycisnąć → przyciśnij, wyjąć → wyjmij.',
  text:`– Przepraszam, {=powiedz} (powiedzieć) mi, jak skorzystać z tego automatu.
– Najpierw {{wrzuć}} (wrzucić) monetę do tego otworu. Potem {{wybierz}} (wybrać) napój, na który masz ochotę. Następnie {{przyciśnij}} (przycisnąć) guzik obok nazwy tego napoju. {{Poczekaj}} (Poczekać) chwilkę i {{wyjmij}} (wyjąć) puszkę z automatu. Powodzenia!
– Dziękuję bardzo!`},
 {n:'XII', p:32, t:'f', pts:0.5,
  ins:'Proszę zamienić czasowniki w nawiasach na formy trybu rozkazującego zgodnie z podanym przykładem.', ua:'Замініть дієслова в дужках на форми наказового способу (ty) за зразком.',
  hint:'Форма «ty»: -ywać → -uj (zapisywać → zapisuj); -ać → -aj; sprawdzić → sprawdź; sporządzić → sporządź; zacząć → zacznij; wyłączyć → wyłącz; wyznaczyć → wyznacz; mieć → miej; umieścić → umieść.',
  text:`Jeśli czujesz, że za dużo czasu spędzasz przed telewizorem, {=skorzystaj} (skorzystać) z naszych rad:
- {{zapisuj}} (zapisywać) przez kilka dni wszystkie oglądane programy,
- {{sprawdź}} (sprawdzić), czy oglądasz tylko to, co uważasz za wartościowe,
- {{sporządź}} (sporządzić) listę rzeczy, które mógłbyś robić zamiast oglądania telewizji,
- {{zacznij}} (zacząć) chodzić na basen,
- {{umawiaj się}} (umawiać się) ze znajomymi,
- gdy jakiś program wydaje ci się mało interesujący, {{wyłącz}} (wyłączyć) telewizor,
- nie {{przełączaj}} (przełączać) na inny kanał,
