- {{wyznacz}} (wyznaczyć) sobie limit czasowy na oglądanie telewizji,
- {{miej}} (mieć) tylko jeden telewizor w domu,
- {{umieść}} (umieścić) go w miejscu, które nie jest wygodne do oglądania.`},
 {n:'XIII', p:33, t:'f', pts:0.5,
  ins:'Proszę zamienić czasowniki w nawiasach na formy trybu rozkazującego zgodnie z podanym przykładem.', ua:'Замініть дієслова в дужках на форми наказового способу (ty) за зразком.',
  hint:'Форма «ty»: podnieść → podniesie → podnieś; przykryć → przykryj; zaufać → zaufaj; położyć → połóż (o → ó); powiesić → powieś; zasłonić → zasłoń; znaleźć → znajdź; wyrzucić → wyrzuć; cieszyć się → ciesz się.',
  text:`{=Poczuj} (Poczuć) atmosferę japońskiego minimalizmu! Osiągniesz to prostymi metodami:
- {{Podnieś}} (Podnieść) poziom podłogi i {{przykryj}} (przykryć) ją matami.
- {{Zaufaj}} (Zaufać) bieli ścian, brązowi i czerni prostych drewnianych mebli.
- Zamiast łóżka {{połóż}} (położyć) materac, zamiast żyrandola {{powieś}} (powiesić) papierowy lampion, a okno {{zasłoń}} (zasłonić) bambusową zasłoną lub lnianą roletą.
- {{Znajdź}} (Znaleźć) w sklepie z porcelaną kilka prostych, szklanych naczyń.
- {{Wyrzuć}} (Wyrzucić) wszystkie niepotrzebne ozdoby.
- {{Postaraj się}} (Postarać się) o bonsai i {{ciesz się}} (cieszyć się) nowym wystrojem swojego mieszkania!`}
]},

{id:'pp', g:1, pl:'Tryb przypuszczający', ua:'Умовний спосіб', ex:[
 {n:'I', p:33, t:'f', pts:0.5,
  ins:'Proszę zamienić czasowniki w nawiasach na formy trybu przypuszczającego zgodnie z podanym przykładem.', ua:'Замініть дієслова в дужках на форми умовного способу за зразком.',
  ex:`Gdyby nie jechali tak szybko nie {=mieliby} (oni – mieć) tego wypadku.`,
  hint:'Форма минулого часу 3-ї особи + by + закінчення особи: -bym, -byś, -by, -byśmy, -byście, -by. Рід: Ewa → -łaby; my (мішана група) → -libyśmy; Haniu → -łabyś; Zosiu i Beato → -łybyście; Krzyś i Tomek → -liby. Безособово: byłoby.',
  text:`Gdyby Ewa miała zdrowe kolano, {{pojechałaby}} (ona – pojechać) w tym roku z nami w góry. Tam całymi dniami {{jeździlibyśmy}} (my – jeździć) na nartach, a wieczorami {{bawilibyśmy się}} (my – bawić się) na dyskotece. Kochani, bardzo {{chciałbym|chciałabym}} (ja – chcieć) was prosić, abyście z nią porozmawiali. Może ty, Haniu, {{namówiłabyś}} (namówić) ją na rehabilitację? Zosiu i Beato, czy {{mogłybyście}} (wy – móc) przyjść jutro do nas na kolację? A może Krzyś i Tomek też {{przyszliby}} (przyjść) razem z wami? Myślę, że najlepiej {{byłoby}} (być), gdybyśmy wspólnie przekonali Ewę, że rehabilitacja jest niezbędna.`},
 {n:'II', p:34, t:'f', pts:0.5,
  ins:'Proszę zamienić czasowniki w nawiasach na formy trybu przypuszczającego zgodnie z podanym przykładem.', ua:'Замініть дієслова в дужках на форми умовного способу за зразком.',
  ex:`Gdybym był bogaty, {=pojechałbym} (pojechać) w podróż dookoła świata.`,
  hint:'Оповідач — чоловік («Gdybym był»): ja → -łbym. «Wiatr i drzewa» — не чоловічо-особова множина → -łyby. Не забудьте «się».',
  text:`Gdybym był ptakiem, nie {{miałbym}} (mieć) żadnych obowiązków, ani problemów. {{Latałbym}} (latać) pod niebem i z góry {{przyglądałbym się}} (przyglądać się) ludziom. Wiatr i drzewa {{opowiadałyby}} (opowiadać) mi różne ciekawe historie, a ja {{śpiewałbym}} (śpiewać) im wesołe piosenki.`},
 {n:'III', p:34, t:'f', pts:0.5,
  ins:'Proszę zamienić czasowniki w nawiasach na formy trybu przypuszczającego zgodnie z podanym przykładem.', ua:'Замініть дієслова в дужках на форми умовного способу за зразком.',
  hint:'ty (чоловік) → -łbyś. Узгодьте з підметом: żona, sekretarka, odpowiedzialność, rodzina → -łaby; zarząd → -łby; zarobki, dzieci (не чоловічо-особові) → -łyby. wynająć → wynajął-.',
  text:`Gdybyś został szefem koncernu, twoje życie {=zmieniłoby się} (zmienić się) radykalnie. Bez wątpienia {{przeprowadziłbyś się}} (ty – przeprowadzić się) do stolicy. Żeby nie tracić czasu na dojazd do pracy, {{wynająłbyś}} (ty – wynająć) mieszkanie blisko biura. Wasz prywatny samochód {{zatrzymałaby}} (zatrzymać) żona, a tobie zarząd firmy {{przydzieliłby}} (przydzielić) służbowe auto z kierowcą. Oczywiście, {{miałbyś}} (ty – mieć) też własną sekretarkę, która {{przygotowywałaby}} (przygotowywać) dla ciebie kawę, ale na tobie {{spoczywałaby}} (spoczywać) pełna odpowiedzialność za finanse i kontrakty. Oczywiście, twoje zarobki {{byłyby}} (być) kilka razy wyższe niż dotychczas, ale po roku takiego życia dzieci {{nie poznawałyby}} (nie poznawać) własnego ojca. Jak długo twoja rodzina {{wytrzymałaby}} (wytrzymać) takie tempo życia?`},
 {n:'IV', p:35, t:'s', pts:1, ext:1,
  ins:'Proszę przekształcić zdania zgodnie z podanym przykładem (tryb przypuszczający).', ua:'Перетворіть речення за зразком: «Gdyby…, …» (умовний спосіб).',
  hint:'Схема: Gdyby + закінчення особи + форма на -ł, …-łby + закінчення. Перша частина — умова («Gdybym miał…», «Gdyby przyszli…»), друга — наслідок («zaprosiłbym…»). Між частинами кома.',
  info:'У реченнях від 1-ї особи приймаються і чоловічі, і жіночі форми.',
  note:'Офіційний ключ подає лише початки речень («Gdybym miał wielki dom, zaprosiłbym…»); тут їх доповнено до повних за текстом завдання.',

   {q:'Moi przyjaciele przyjdą i urządzę dla nich wielkie przyjęcie.', a:['Gdyby (przyszli moi przyjaciele|moi przyjaciele przyszli), urządziłbym dla nich wielkie przyjęcie.','Gdyby (przyszli moi przyjaciele|moi przyjaciele przyszli), urządziłabym dla nich wielkie przyjęcie.']},
   {q:'Przyjęcie będzie udane i powtórzę je kilka razy.', a:['Gdyby przyjęcie było udane, powtórzyłbym je kilka razy.','Gdyby przyjęcie było udane, powtórzyłabym je kilka razy.']},
   {q:'Kupię autobus i zabiorę przyjaciół w podróż po Europie.', a:['Gdybym kupił autobus, zabrałbym przyjaciół w podróż po Europie.','Gdybym kupiła autobus, zabrałabym przyjaciół w podróż po Europie.']},
   {q:'Podróż spodoba się wszystkim i pojedziemy w podróż dookoła świata.', a:['Gdyby podróż (spodobała się wszystkim|wszystkim się spodobała|się wszystkim spodobała), pojechalibyśmy w podróż dookoła świata.']}

 {n:'V', p:36, t:'s', pts:1,
  ins:'Proszę przekształcić zdania zgodnie z podanym przykładem (tryb przypuszczający).', ua:'Перетворіть речення за зразком: «Gdyby…, …» (умовний спосіб).',

   {q:'Ponieważ nie zarabiam dużo, nie mogę kupić sobie mieszkania.', a:['Gdybym zarabiał dużo, mógłbym kupić sobie mieszkanie.','Gdybym zarabiała dużo, mogłabym kupić sobie mieszkanie.']},

   {q:'Ponieważ nie mieszkam sam, codziennie muszę robić porządki.', a:['Gdybym mieszkał sam, nie musiałbym codziennie robić porządków.']}

{id:'pi', g:2, pl:'Przyimki', ua:'Прийменники', ex:[

  text:`[[=*Od|Przez|W]] kilku ostatnich lat jeździmy na wakacje [[*na|do|nad]] Mazury. Zatrzymujemy się [[*w|na|koło]] pobliżu Mikołajek w domu [[pod|przy|*nad]] jeziorem. Często wylegujemy się na pobliskiej łące [[za|bez|*przez]] cały dzień, od rana do wieczora. Jest to [[*według|bez|w]] nas najlepszy sposób na odpoczynek. Czasami wędrujemy godzinami [[po|do|*przez]] okoliczne lasy, wiatr szumi, a [[*wokół|pod|u]] nas jest nietknięta ludzką ręką natura. [[*Podczas|Przez|Koło]] takich wędrówek nabieramy sił [[*do|przy|w]] pracy. [[Na|Przy|*Po]] powrocie do domu wciąż wspominamy chwile spędzone na urlopie.`},
 {n:'II', p:37, t:'b', pts:0.5, ins1:2,

  text:`{=Do} Warszawy przyjechałam {{z}} Wejherowa, niedużego miasta {{na}} Pomorzu. Moje siostry były tu już wcześniej, mieszkały {{u}} kuzynki, której córki wyjechały {{za}} granicę. Starsza siostra zaczęła studiować {{na|w}} uniwersytecie, a średnia {{w}} Szkole Teatralnej. Nie mogłam {{z}} nimi zamieszkać, bo mieszkanie nie było dość duże. {{Dzięki}} pomocy szkolnej koleżanki mogłam {{przez}} kilka miesięcy pomieszkać {{w}} ładnej i wygodnej kawalerce jej brata.`},
 {n:'III', p:37, t:'f', pts:0.25,

 {n:'IV', p:38, t:'b', pts:0.5, ins1:2,
  ins:'Proszę uzupełnić tekst wyrazami z ramki zgodnie z podanym przykładem. Uwaga! Każdego słowa można użyć tylko raz. Jeden z nich jest niepotrzebny!', ua:'Доповніть текст словами з рамки за зразком. Увага! Кожне слово можна вжити лише раз. Одне з них зайве! Торкніться пропуску, а потім слова в рамці.',
  bank:['z','po','od','na','u','w','dla','przy','ze','bez','o','nad'],
  hint:'Перед збігом приголосних — ze (ze znajomymi). До озера (куди?) — nad + знахідний. Через якийсь час — po + місцевий. Сталі вирази: u celu, w samą porę, bez końca, iść na ryby. Біля вогнища — przy; о котрій? — o + місцевий; для кого? — dla.',
  text:`Damian postanowił odpocząć {=od} swych ciężkich obowiązków i wraz {{ze}} znajomymi wyjechał {{nad}} jezioro. Gdy {{po}} dwóch godzinach znalazł się {{u}} celu podróży, zaczął przygotowywać ognisko. Zresztą {{w}} samą porę, bo już robiło się coraz ciemniej i chłodniej. {{Przy}} ognisku i dźwiękach gitary mógłby bawić się {{bez}} końca, ale dość szybko poszedł spać, gdyż obiecał sobie, że wstanie {{o}} wschodzie słońca, weźmie wędkę i pójdzie {{na}} ryby, a następnie przygotuje śniadanie {{dla}} swoich znajomych.`},
 {n:'V', p:38, t:'f', pts:0.75,

  hint:'Керування дієслів: zarobić na (що), wyjść za mąż, przygotowywać się do (чого), zdawać na studia, pomyśleć o (кому), brakuje pieniędzy na (що), pożyczać od (кого), prosić o (що). «…rana …wieczora» — від і до.',
  text:`{=Po} nagłej śmierci męża pani Wanda musiała pracować {{od}} rana {{do}} wieczora, żeby zarobić {{na}} utrzymanie gospodarstwa domowego i wykształcenie dzieci. Córka właśnie kończyła studia i planowała wyjść {{za}} mąż. Syn przygotowywał się {{do}} egzaminu maturalnego i chciał zdawać {{na}} studia. Mogłoby się wydawać, że kiedy dzieci skończą studia, pani Wanda będzie mogła w końcu pomyśleć {{o}} sobie. Nic bardziej błędnego! Córce ciągle brakuje pieniędzy {{na}} opiekunkę do dziecka, więc pożycza je {{od}} matki. Syn wziął kredyt z banku na kupno mieszkania i co miesiąc prosi ją {{o}} kilka złotych.`},
 {n:'VI', p:39, t:'f', pts:0.5,

  text:`– Kiedy zaczął Pan myśleć {=o} zawodzie aktora?

  ins:'Proszę podkreślić poprawną formę wyrazu zgodnie z podanym przykładem.', ua:U.pod,
  hint:'Підмет — у називному. Після «gdyby» в головному реченні — умовний спосіб. «dziękować» — кому? (sobie). «od», «dla» + родовий. Загальна істина — теперішній час. Чоловічо-особова множина прикметника: -i.',
  text:`[[=Psychologów|*Psychologowie|Psychologom]] odkryli, że małżeństwo [[mogło|może|*mogłoby]] polepszyć wzajemne relacje, gdyby zaczęło dziękować [[siebie|*sobie|sobą]] za różne domowe przysługi. Dotyczy [[*to|tego|temu]] nie tylko małżeństw, ale rodzin w ogóle. „Dziękuję”, jako słówko [[domowego|domowym|*domowe]], jest odświeżaczem [[*atmosfery|atmosferą|atmosferze]]. Dziękujmy nie tylko wtedy, gdy wstajemy od [[stole|*stołu|stołem]]. „Dziękuję” znaczy, że [[*rozumiemy|zrozumiemy|zrozumielibyśmy]], że ktoś starał się dla [[nam|nami|*nas]]. Na tym, między innymi, [[polegało|*polega|będzie polegało]] życie rodzinne, by zauważać, że nasi bliscy są dla nas [[uprzejme|uprzejmymi|*uprzejmi]].`},
 {n:'II', p:39, t:'c', pts:0.5,
  ins:'Proszę podkreślić poprawną formę wyrazu zgodnie z podanym przykładem.', ua:U.pod,
  hint:'Числівник 5+ із неособовим іменником: pięć pytań, sześć osób. Із чоловічо-особовим іменником у родовому: trzech uczestników (дієслово в однині). «z» + орудний: siedmioma. Підмет чоловічо-особовий у називному: dwaj.',
  text:`Pan Adam wystąpił w teleturnieju „Jeden z [[=dziesięć|*dziesięciu|dziesiąty]]”. Odpowiedział poprawnie na [[*pięć|pięciu|pięcioma]] pytań i doszedł do finału, w którym walczy już tylko [[trzy|trzej|*trzech]] uczestników. Pan Adam okazał się więc lepszy niż [[*sześć|sześciu|sześcioma]] innych osób – a może po prostu miał więcej szczęścia. W finale poradził sobie z [[siedem|siedmiu|*siedmioma]] pytaniami, ale to nie wystarczyło, by wygrać – jego [[dwa|*dwaj|dwóch]] przeciwnicy odpowiedzieli na znacznie więcej.`},
 {n:'III', p:40, t:'f', pts:0.5,

  hint:'Кількісний чи порядковий? «rocznicę» (котру?) — порядковий у знахідному жіночого роду; «przed… wieczorem» — година, порядковий в орудному. «kolegów» — чоловічо-особова форма в родовому; «róż» — кількісний (5+ + родовий).',
  text:`Maj to szczególny miesiąc dla naszej rodziny. Ja obchodzę urodziny {=piątego} (5) maja, a moi {=dwaj} (2) bracia, którzy są bliźniakami, dzień później. Zwykle zapraszają do domu swoich ulubionych {{trzech}} (3) kolegów i bawią się aż do rana. Pod koniec miesiąca moi rodzice będą świętowali {{dwudziestą}} (20) rocznicę ślubu. Mama dostanie na pewno od taty {{dwadzieścia}} (20) róż, a przed {{siódmą}} (7) wieczorem wybiorą się do restauracji.`},
 {n:'IV', p:40, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst przymiotnikami utworzonymi od wyrazów w nawiasach zgodnie z podanym przykładem.', ua:'Доповніть текст прикметниками, утвореними від слів у дужках, за зразком.',
  ex:`Już od tygodnia można oglądać w kinach nowy {=polski} (Polska) film.`,
  hint:'Прикметники від назв країн — на -ski / -cki, пишуться з малої літери. Узгодьте з іменником: kuchnię (знахідний ж. р.), wina (родовий), miasta (множина), mistrzów (родовий множини), w kurorcie (місцевий).',
  text:`Podróże to moje największe hobby. Dzięki nim bardzo polubiłem {{czeską}} (Czechy) kuchnię, a zwłaszcza pyszne knedliki. Nie zapomnę też smaku {{francuskiego}} (Francja) wina. W czasie letnich wakacji zwiedziłem dokładnie wspaniałe {{włoskie}} (Włochy) miasta, a w Amsterdamie obejrzałem obrazy {{holenderskich}} (Holandia) mistrzów. Zimowe ferie planuję spędzić na nartach w jakimś {{austriackim}} (Austria) kurorcie.`},
 {n:'V', p:40, t:'f', pts:0.75,
  ins:'Proszę uzupełnić tekst właściwymi rzeczownikami utworzonymi od wyrazów w nawiasach zgodnie z podanym przykładem (nazwy mieszkańców krajów).', ua:'Доповніть текст іменниками, утвореними від слів у дужках (назви мешканців країн), за зразком.',
  ex:`{=Polacy} (Polska) mają bigos i pierogi. A z jakich potraw są znane kraje Europy?`,
  hint:'Назви мешканців пишуться з великої літери. Потрібен називний множини чоловічо-особовий: -i / -y з чергуванням (Czech → Czesi, Węgier → Węgrzy), -e (Hiszpan → Hiszpanie), -cy (Ukrainiec → Ukraińcy).',
  text:`{{Czesi}} (Czechy) mają knedliki, a {{Hiszpanie}} (Hiszpania) paellę. {{Szwajcarzy}} (Szwajcaria) są znani z sera, a {{Ukraińcy}} (Ukraina) z ukraińskiego barszczu. {{Węgrzy}} (Węgry) oferują wspaniały gulasz.`},
 {n:'VI', p:41, t:'f', pts:0.5,
  ins:'Proszę uzupełnić tekst właściwą formą wyrazów w nawiasach zgodnie z podanym przykładem.', ua:U.naw,
  hint:'Іменники: «nawiązywanie» (чого?) — родовий; «na», «w» (де?) — місцевий; «dzięki» — давальний; «zwracać» (що?) — знахідний. Дієслова: ludzie → 3-тя особа множини, kto → 3-тя особа однини. Прикметник узгодьте з «łącza» (родовий).',
  text:`W ostatnich {=latach} (rok) coraz częstszym sposobem nawiązywania {{kontaktu}} (kontakt) z drugą osobą jest Internet. Na {{czatach}} (czat) internetowych wszystko jest łatwiejsze, ponieważ rozmówca jest anonimowy. W każdym {{momencie}} (moment) można nie odpowiadać na niewygodne pytania lub wyłączyć komputer. Są ludzie, którzy {{poznali się|poznają się}} (poznać się) dzięki {{komputerowi}} (komputer), a następnie {{pobrali się|pobierają się}} (pobrać się). Jednak trudno sprawdzić, kto {{siedzi}} (siedzieć) po drugiej stronie {{internetowego}} (internetowy) łącza i jakie ma zamiary. Dlatego psychologowie ostrzegają rodziców, żeby zwracać {{uwagę}} (uwaga) na swoje dzieci przesiadujące przed ekranem komputera. Niekiedy internetowe znajomości mogą okazać się tragiczne w {{skutkach}} (skutek, l. mn).`},
 {n:'VII', p:41, t:'c', pts:0.5,

  ex:`Ania i Kasia [[=*miały|mieli|będą mieli]] trudną podróż do Poznania.`,

  text:`4 listopada Ania i Kasia wracały z Krakowa do Poznania. [[Przychodziły|*Przyszły|Będą przychodziły]] na dworzec pół godziny przed odjazdem pociągu, ale niestety w kasie nie sprzedano im ani biletów, ani miejscówek, ponieważ wszystkie miejsca były już zarezerwowane. Gdy pociąg [[wjedzie|będzie wjeżdżał|*wjechał]] na stację i zatrzymał się na peronie, Ania [[*znalazła|znalazły|znajdą]] konduktora i [[zapytają|*zapytała|zapytały]] go, czy [[mogła|*może|mogli]] z koleżanką wsiąść do pociągu bez biletu i miejscówki. Konduktor [[*pozwolił|pozwalał|pozwoli]] jej na to. W pociągu [[panuje|*panował|panowali]] tłok, ponieważ wiele osób, tak jak Ania i Kasia, [[wsiedli|*wsiadło|wsiądą]] do pociągu za zgodą konduktora. Ania postawiła torbę na korytarzu, rozpięła kurtkę i [[*zaczęła|zaczną|zacznie]] zastanawiać się, jak zniesie tę podróż. Kasia tymczasem już wesoło [[rozmawia|będzie rozmawiała|*rozmawiała]] z jakimś przystojnym chłopakiem.`},

  bank:['a','albo','chociaż','ale','czy','i','bo','że','żeby'],
  hint:'a — зіставлення; ale — протиставлення; chociaż — хоча; że — після «myślą», «mam nadzieję»; żeby — після «chciałbym» (далі форма на -ł); bo — причина; czy — після «nie wiem»; i — додавання; albo — вибір.',
  text:`Ania jest moją siostrą {=i} Marta jest moją siostrą. Ania jest starsza, {{a}} Marta młodsza. {{Chociaż}} są siostrami, to wcale nie są do siebie podobne. Wszyscy myślą, {{że}} to Marta jest starsza, {{bo}} jest bardzo poważna. Chciałbym, {{żeby}} obie były tak wesołe jak Ania, {{ale}} Marta nie umie się niestety śmiać. Nie wiem, {{czy}} to się kiedyś zmieni. Teraz Marta kończy szkołę {{i}} chce zdawać na studia. Zamierza studiować informatykę – na uniwersytecie {{albo}} na politechnice. Mam nadzieję, {{że}} życie studenckie poprawi jej humor.`},

 {n:'X', p:43, t:'s', pts:1,

  text:`W {=Polsce} (Polska) jestem od trzech {{tygodni}} (tydzień). Przyjechałam tu z {{Francji}} (Francja), żeby zrobić reportaż o polsko-francuskich małżeństwach. Trochę czasu spędzam w {{bibliotece}} (biblioteka), ale przede wszystkim spotykam się z takimi małżeństwami oraz z {{ludźmi}} (ludzie), którzy je znają. Pomagają mi w tym {{koledzy}} (kolega) – {{dziennikarze}} (dziennikarz) z polskich {{gazet}} (gazeta) i polskiego {{radia}} (radio). Są to {{wspaniali}} (wspaniały) specjaliści i {{dobrzy}} (dobry) przyjaciele.`},

function topicStat(t) {

  for (const e of t.ex) { const st = S.ex[e.id]; max += e.max; if (st && st.best != null) { done++; pts += st.best; dmax += e.max; } }

}

/* ================= Озвучення ================= */
let speaking = false;
function plainText(ex) {
  const parts = [];
  const tokText = (toks, isList) => {
    let s = '', afterGap = false;
    toks.forEach((t, k) => {
      if (t.k === 't') {
        let x = t.s;
        if (afterGap) x = x.replace(/^\s*\([^)]*\)/, '');
        const nx = toks[k + 1];
        if (isList && nx && (nx.k === 'g' || nx.k === 'x')) x = x.replace(/\([^)]*\)\s*$/, '');
        s += x; afterGap = false;
      } else if (t.k === 'g') { s += t.g.show[0]; afterGap = true; }
      else if (t.k === 'x') { s += t.s; afterGap = true; }
      else if (t.k === 'xc') { s += t.opts[t.ok]; afterGap = false; }
      else if (t.k === 'u') { s += t.s; afterGap = false; }
    });
    return s.replace(/\s+/g, ' ').trim();
  };
  if (ex.t === 's') { if (ex.exs) parts.push(ex.exs.a.replace(/\s*\([^)]*\)/g, '').replace(/\/\w+/g, '')); ex.gaps.forEach(g => parts.push(g.show[0])); }
  else ex.blocks.forEach(b => { const s = tokText(b.toks, b.type !== 'p'); if (s) parts.push(s); });
  return parts;
}
function stopSpeech() { if (window.speechSynthesis) speechSynthesis.cancel(); speaking = false; }
function speak(ex, btn) {
  const ss = window.speechSynthesis;
  if (!ss || typeof SpeechSynthesisUtterance === 'undefined') { toast('Цей браузер не підтримує озвучення.'); return; }
  if (speaking) { stopSpeech(); btn.textContent = '▶ Прослухати'; return; }
  const go = () => {
    const voice = ss.getVoices().find(v => /^pl/i.test(v.lang));
    if (!voice) { toast('На цьому пристрої немає польського голосу. Додайте його в налаштуваннях системи (Мова й мовлення).'); return; }
    const chunks = [];
    plainText(ex).forEach(p => (p.match(/[^.!?…]+[.!?…]*["”)]*\s*/g) || [p]).forEach(c => { if (c.trim()) chunks.push(c.trim()); }));
    speaking = true; btn.textContent = '■ Зупинити';
    chunks.forEach((c, k) => {
      const u = new SpeechSynthesisUtterance(c);
      u.lang = 'pl-PL'; u.voice = voice; u.rate = 0.9;
      if (k === chunks.length - 1) u.onend = () => { speaking = false; if (document.contains(btn)) btn.textContent = '▶ Прослухати'; };
      ss.speak(u);
    });
  };
  if (ss.getVoices().length) go();
  else {
    let done = false;
    const once = () => { if (done) return; done = true; go(); };
    ss.addEventListener('voiceschanged', once, { once: true });
    setTimeout(once, 700);
  }
}

function splitSentences(toks) {
  const out = [[]];
  toks.forEach((t, k) => {
    if (t.k !== 't') { out[out.length - 1].push(t); return; }
    const re = /[.!?…]+[”"»)]*\s+(?=[A-ZĄĆĘŁŃÓŚŹŻ„"–—\[(])|[.!?…]+[”"»)]*\s+$/g;
    let last = 0, m;
    while ((m = re.exec(t.s))) {
      const end = m.index + m[0].length;
      if (end === t.s.length && k === toks.length - 1) break;
      out[out.length - 1].push({ k: 't', s: t.s.slice(last, end) }); out.push([]); last = end;
    }
    if (last < t.s.length) out[out.length - 1].push({ k: 't', s: t.s.slice(last) });
  });
  return out.filter(a => a.length);
}

  const b = ex.blocks[g.bi], ss = splitSentences(b.toks);
  const k = ss.findIndex(s => s.some(t => t.k === 'g' && t.g === g));
  let toks = ss[k];
  const len = toks.reduce((n, t) => n + (t.k === 't' ? t.s.length : 8), 0);
  if (len < 45 && k > 0) toks = ss[k - 1].concat(toks);
  return toks;
}

}

  return h('div', { class: 'card' }, h('h3', null, 'Історія спроб'),
    h('table', { class: 't', style: 'margin-top:.5rem' }, h('thead', null, h('tr', null, h('th', null, 'Дата'), h('th', { class: 'num' }, 'Бали'), h('th', { class: 'num' }, '%'), h('th', null, 'Час'))),
      h('tbody', null, S.exam.hist.map(x => h('tr', null, h('td', null, fmtDate(x.at)), h('td', { class: 'num' }, fmt(x.pts) + ' / ' + fmt(EXAM_MAX)),
        h('td', { class: 'num ' + (x.pts / EXAM_MAX >= 0.5 ? 'pass' : 'fail') }, pct(x.pts, EXAM_MAX) + ' %'), h('td', null, fmtDur(x.dur) + (x.timed ? '' : ' (без таймера)')))))));
}
function startExam(timed) { S.exam.cur = { start: Date.now(), timed, a: {}, pos: 0 }; saveNow(); route(); }
function pageExam() {
  const cur = S.exam.cur;
  if (cur && cur.timed && examLeft(cur) <= 0) return finishExam(true);
  if (!cur) {
    app.append(head('Пробний іспит', 'Przykładowy zestaw zadań · 10 завдань · 40 балів'),
      h('div', { class: 'card' },
        h('p', null, 'Як на справжньому іспиті: без підказок, без перевірки й ключа до завершення. Результат і розбір з ключем — після того, як натиснете «Завершити» або вийде час.'),
        h('div', { class: 'row' }, h('button', { class: 'btn pri', type: 'button', onclick: () => startExam(true) }, 'Почати з таймером 45 хв'),
          h('button', { class: 'btn', type: 'button', onclick: () => startExam(false) }, 'Почати без таймера'))),
      examInfo());
    if (S.exam.last) app.append(h('div', { class: 'card row' }, h('div', { class: 'grow' }, h('div', { class: 'small mut' }, 'Останній результат · ' + fmtDate(S.exam.last.at)), h('div', { class: 'big' }, fmt(examTotal(S.exam.last)) + ' / ' + fmt(EXAM_MAX))),
      h('a', { class: 'btn', href: '#/exam/result' }, 'Результат і розбір')));
    const ht = histTable(); if (ht) app.append(ht);
    return;
  }
  // іспит триває
  cur.pos = Math.min(Math.max(cur.pos || 0, 0), EXAM.length - 1);
  const ex = EXAM[cur.pos];
  const filledOf = e => { const a = cur.a[e.id] || {}; return e.gaps.filter(g => a[g.i] !== undefined && a[g.i] !== '').length; };
  const tEl = h('div', { class: 'timer', role: 'timer', 'aria-label': 'Залишок часу' });
  const tick = () => {
    if (!cur.timed) { tEl.textContent = '∞'; tEl.title = 'Без таймера'; return; }
    const left = examLeft(cur);
    if (left <= 0) { finishExam(true); return; }
    tEl.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    tEl.classList.toggle('low', left <= 300);
  };
  tick(); clearInterval(timerInt); if (cur.timed) timerInt = setInterval(tick, 500);
  const go = p => { cur.pos = p; saveNow(); route(); };
  const overview = () => {
    const grid = h('div', { class: 'ovw' }, EXAM.map((e, k) => h('button', { class: 'btn' + (k === cur.pos ? ' pri' : ''), type: 'button', onclick: () => { closeModal(); go(k); } }, h('span', { lang: 'pl' }, e.n), h('small', null, filledOf(e) + '/' + e.gaps.length))));
    openModal('Завдання іспиту', h('div', null, h('p', { class: 'small mut' }, 'Під номером — скільки пропусків заповнено.'), grid));
  };
  const askFinish = () => {
    const filled = EXAM.reduce((s, e) => s + filledOf(e), 0);
    confirmBox('Завершити іспит?', 'Заповнено ' + filled + ' з ' + EXAM_GAPS + ' пропусків. Після завершення відповіді змінити не можна — ви побачите результат і розбір із ключем.', 'Завершити', () => finishExam(false));
  };
  const o = {
    mode: 'exam', ans: cur.a[ex.id] || {}, marks: null, insert: makeInsert(ex),
    onChange(i, val) { const a = cur.a[ex.id] || (cur.a[ex.id] = {}); o.ans = a; if (val === undefined || val === '') delete a[i]; else a[i] = val; save(); }
  };
  app.append(
    h('div', { class: 'xbar' }, tEl,
      h('button', { class: 'btn sm grow', type: 'button', onclick: overview }, 'Завдання ' + ex.n + ' · ' + (cur.pos + 1) + ' з ' + EXAM.length + ' ▾'),
      h('button', { class: 'btn sm', type: 'button', onclick: askFinish }, 'Завершити')),
    exHeader(ex), renderIntro(ex, o), h('div', { class: 'card' }, renderBody(ex, o)));
  setDock({
    letters: ex.typed && !(ex.ins1 === 2 && coarse), acts: [
      { t: '← Попереднє', on: () => { if (cur.pos > 0) go(cur.pos - 1); } },
      cur.pos < EXAM.length - 1 ? { t: 'Наступне →', cls: 'pri', on: () => go(cur.pos + 1) } : { t: 'Завершити іспит', cls: 'pri', on: askFinish }
    ]
  });
}
function pageExamResult() {
  const L = S.exam.last;
  if (!L) return pageExam();
  const tot = examTotal(L), p = pct(tot, EXAM_MAX), pass = tot / EXAM_MAX >= 0.5;
  app.append(h('a', { class: 'crumb', href: '#/exam' }, '← Іспит'), head('Результат іспиту', fmtDate(L.at) + ' · ' + fmtDur(L.dur) + (L.timed ? (L.auto ? ' · час вийшов' : '') : ' · без таймера')),
    h('div', { class: 'card' },
      h('div', { class: 'big ' + (pass ? 'pass' : 'fail') }, fmt(tot) + ' / ' + fmt(EXAM_MAX) + ' б. · ' + p + ' %'),
      h('p', null, pass ? h('b', { class: 'pass' }, '✓ Поріг 50 % (20 з 40 б.) подолано.') : h('b', { class: 'fail' }, '✗ До порога 50 % (20 з 40 б.) бракує ' + fmt(EXAM_MAX / 2 - tot) + ' б.')),
      h('div', { class: 'row' }, h('a', { class: 'btn pri', href: '#/exam/review' }, 'Розбір із ключем'), h('button', { class: 'btn', type: 'button', onclick: () => { location.hash = '#/exam'; } }, 'Нова спроба'))));
  const weak = [];
  const tb = h('tbody', null, EXAM.map(ex => {
    const got = examTaskPts(L, ex), t = TMAP[ex.tp];
    if (got / ex.max < 0.7 && weak.indexOf(t) < 0) weak.push(t);
    return h('tr', null, h('td', { lang: 'pl' }, h('b', null, ex.n)), h('td', null, h('span', { lang: 'pl' }, t.pl), h('br'), h('span', { class: 'small mut' }, TYPE_UA[ex.t])),
      h('td', { class: 'num' }, fmt(got) + ' / ' + fmt(ex.max)), h('td', { class: 'num ' + (got / ex.max >= 0.5 ? 'pass' : 'fail') }, pct(got, ex.max) + ' %'));
  }));
  app.append(h('div', { class: 'card' }, h('h3', null, 'По завданнях'),
    h('table', { class: 't', style: 'margin-top:.5rem' }, h('thead', null, h('tr', null, h('th', null, '№'), h('th', null, 'Тема'), h('th', { class: 'num' }, 'Бали'), h('th', { class: 'num' }, '%'))), tb)));
  app.append(h('div', { class: 'card' }, h('h3', null, 'Що повторити'),
    weak.length ? h('ul', null, weak.map(t => h('li', null, h('a', { href: '#/t/' + t.id, lang: 'pl' }, t.pl), ' — ' + t.ua)))
      : h('p', null, 'У кожному завданні щонайменше 70 % — слабких тем не видно.'),
    h('p', { class: 'small mut', style: 'margin-bottom:0' }, 'Помилки з іспиту додано до «Моїх помилок». У завданні X (вільні речення) можна зарахувати власний правильний варіант у розборі.')),
    examInfo());
  const ht = histTable(); if (ht) app.append(ht);
}
function pageExamReview() {
  const L = S.exam.last;
  if (!L) return pageExam();
  app.append(h('a', { class: 'crumb', href: '#/exam/result' }, '← Результат'), head('Розбір іспиту', 'Ваші відповіді, позначки й правильні відповіді з ключа.'));
  EXAM.forEach(ex => {
    const card = h('div', { class: 'card' });
    const draw = () => {
      card.textContent = '';
      const got = examTaskPts(L, ex);
      const o = {
        mode: 'review', ans: L.a[ex.id] || {}, marks: L.marks[ex.id],
        selfBtn: (g, mark) => {
          if (mark === 'ok') return null;
          const k = ex.id + '#' + g.i, on = !!L.self[k];
          if (!on && !normA((L.a[ex.id] || {})[g.i] || '')) return null;
          return h('button', { class: 'btn sm', type: 'button', style: 'margin-top:.5rem', 'aria-pressed': String(on), onclick: () => {
            if (on) delete L.self[k]; else { L.self[k] = true; delete S.err[k]; }
            if (S.exam.hist[0] && S.exam.hist[0].at === L.at) S.exam.hist[0].pts = examTotal(L);
            saveNow(); updateBadge(); draw();
          } }, on ? '✓ Зараховано за самооцінкою (скасувати)' : 'Моя відповідь теж правильна — зарахувати');
        }
      };
      card.append(h('div', { class: 'row' }, h('h3', { class: 'grow', lang: 'pl' }, exTitle(ex)), h('b', { class: got / ex.max >= 0.5 ? 'pass' : 'fail' }, fmt(got) + ' / ' + fmt(ex.max) + ' б.')),
        h('p', { class: 'small mut', lang: 'pl', style: 'margin-top:.25rem' }, ex.ins));
      if (ex.preB) card.append(h('div', { class: 'box' }, renderBlocks(ex, ex.preB, null, 'static')));
      card.append(renderBody(ex, o));
      if (ex.t === 's') card.append(h('p', { class: 'small mut' }, 'Вільні речення перевіряються за ключем дослівно (без урахування регістру й пунктуації). Якщо ваш варіант правильний за змістом і граматикою, зарахуйте його самі.'));
      card.append(h('div', { class: 'row', style: 'margin-top:.5rem' }, h('button', { class: 'btn sm', type: 'button', onclick: () => openSheet(ex.tp) }, 'Шпаргалка: ' + TMAP[ex.tp].ua),
        h('button', { class: 'btn sm', type: 'button', onclick: () => openModal('Підказка до завдання ' + ex.n, h('p', null, ex.hint)) }, 'Правило')));
    };
    draw(); app.append(card);
  });
  app.append(h('div', { class: 'pn' }, h('a', { class: 'btn', href: '#/exam/result' }, '← Результат'), h('a', { class: 'btn', href: '#/errors' }, 'Мої помилки →')));
}

/* ---------- Налаштування ---------- */
function applyFont() { document.documentElement.style.setProperty('--fs', [1, 1.125, 1.25][S.font || 0]); }
function pageSettings() {
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Розмір шрифту' }, ['A', 'A+', 'A++'].map((t, k) =>
    h('button', { type: 'button', 'aria-pressed': String((S.font || 0) === k), onclick: () => { S.font = k; saveNow(); applyFont(); route(); } }, t)));
  const file = h('input', { type: 'file', accept: '.json,application/json', class: 'vh', tabindex: '-1', 'aria-hidden': 'true' });
  file.addEventListener('change', () => {
    const f = file.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onerror = () => toast('Не вдалося прочитати файл. Прогрес не змінено.');
    rd.onload = () => {
      let o = null;
      try { o = JSON.parse(rd.result); } catch (e) { o = null; }
      const d = o && o.app === 'pl_b1' ? o.data : null;
      if (!validState(d)) { toast('Це не файл прогресу тренажера або він пошкоджений. Прогрес не змінено.'); file.value = ''; return; }
      S = d; saveNow(); applyFont(); updateBadge(); toast('Прогрес імпортовано.'); route();
    };
    rd.readAsText(f);
  });
  const exportIt = () => {
    saveNow();
    const blob = new Blob([JSON.stringify({ app: 'pl_b1', v: 2, exported: new Date().toISOString(), data: S })], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'polski-b1-progres-' + new Date().toISOString().slice(0, 10) + '.json' });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Файл прогресу збережено в «Завантаження».');
  };
  const ov = overall();
  app.append(head('Налаштування'),
    h('div', { class: 'card' }, h('h3', null, 'Розмір шрифту'), h('div', { style: 'margin-top:.5rem' }, seg)),
    h('div', { class: 'card' }, h('h3', null, 'Прогрес'),
      h('p', { class: 'small mut' }, 'Прогрес зберігається в цьому браузері на цьому пристрої' + (storageOK ? '.' : ' — але зараз сховище недоступне, тож після закриття сторінки він зникне.') + ' Щоб перенести його на інший пристрій, експортуйте файл і імпортуйте його там.'),
      h('p', { class: 'small' }, 'Зараз: ' + ov.done + ' з ' + ov.n + ' вправ, ' + errKeys().length + ' у «Моїх помилках», спроб іспиту: ' + S.exam.hist.length + '.'),
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: exportIt }, 'Експорт у файл'),
        h('button', { class: 'btn', type: 'button', onclick: () => file.click() }, 'Імпорт із файла'), file,
        h('button', { class: 'btn', type: 'button', onclick: () => confirmBox('Скинути весь прогрес?', 'Буде стерто відповіді, результати, «Мої помилки» та історію іспитів. Цю дію не можна скасувати — за потреби спершу зробіть експорт.', 'Скинути все', () => { const f = S.font; S = fresh(); S.font = f; saveNow(); updateBadge(); toast('Прогрес скинуто.'); route(); }) }, 'Скинути все'))),
    h('div', { class: 'card' }, h('h3', null, 'Як рахується результат'),
      h('ul', { class: 'small' },
        h('li', null, 'Бал вправи — результат ', h('b', null, 'першої перевірки'), '. Після неї можна виправляти помилки й перевіряти знову, але бал не зміниться.'),
        h('li', null, 'У прогрес іде найкращий результат першої перевірки. Щоб покращити його, скиньте вправу й виконайте її ще раз.'),
        h('li', null, 'Ключ балів не додає: якщо відкрити його до перевірки, зараховується те, що було введено на той момент.'),
        h('li', null, 'Регістр літер, зайві пробіли й розділові знаки не враховуються. Відповідь без польських знаків (nia замість nią) отримує позначку «≈ майже» і балів не дає.'))),
    examInfo(),
    h('p', { class: 'small mut' }, 'Тексти вправ і ключ — зі збірника «Poprawność gramatyczna. B1» Państwowej Komisji ds. Poświadczania Znajomości Języka Polskiego jako Obcego (certyfikatpolski.pl). Тренажер працює без інтернету з одного файла.'));
}

/* ================= Маршрути ================= */
function route() {
  stopSpeech(); clearInterval(timerInt); closeModal();
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  app.textContent = ''; setDock(null); lastInput = null; setShift(false);
  let nav = 'home';
  if (p[0] === 't') pageTopic(p[1]);
  else if (p[0] === 'e') pageExercise(p[1], +p[2]);
  else if (p[0] === 'errors') { nav = 'errors'; if (p[1] === 'train') pageTrain(p[2]); else pageErrors(); }
  else if (p[0] === 'exam') { nav = 'exam'; if (p[1] === 'result') pageExamResult(); else if (p[1] === 'review') pageExamReview(); else pageExam(); }
  else if (p[0] === 'settings') { nav = 'settings'; pageSettings(); }
  else pageHome();
  $$('.top nav a').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  updateBadge(); placeDock();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ================= Самоперевірка даних ================= */
window.B1 = {
  selfTest() {
    const bad = []; let checked = 0, gaps = 0;
    ALL.concat(EXAM).forEach(ex => {
      let ok = 0;
      ex.gaps.forEach(g => {
        gaps++;
        (g.kind === 'c' ? [g.ok] : g.raw).forEach(v => { checked++; if (judge(g, v) !== 'ok') bad.push(ex.id + '#' + (g.i + 1) + ': ' + v); });
        if (judge(g, g.kind === 'c' ? g.ok : g.show[0]) === 'ok') ok++;
        if (g.kind === 'c') g.opts.forEach((x, k) => { if (k !== g.ok && judge(g, k) !== 'bad') bad.push(ex.id + '#' + (g.i + 1) + ': wrong option accepted'); });
      });
      if (r2(ok * ex.pts) !== ex.max) bad.push(ex.id + ': key gives ' + r2(ok * ex.pts) + ' of ' + ex.max);
    });
    return { exercises: ALL.length, examTasks: EXAM.length, gaps, answersChecked: checked, totalMax: TOTAL_MAX, examMax: EXAM_MAX, bad };
  },
  judgeText(id, n, val) { return judge(EXMAP[id].gaps[n - 1], val); },
  key(id, n) { const g = EXMAP[id].gaps[n - 1]; return g.kind === 'c' ? g.ok : g.show[0]; },
  ids() { return ALL.map(e => e.id); }
};

applyFont();
route();
// час іспиту вийшов, поки сторінка була закрита
if (S.exam.cur && S.exam.cur.timed && examLeft(S.exam.cur) <= 0) finishExam(true);
})();
</script>
